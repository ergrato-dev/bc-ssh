# Laboratorio de bc-ssh. Uso: docs/setup-entorno.md
#   docker compose up -d --build        # levanta los servidores
#   docker compose run --rm client      # shell del estudiante (cliente SSH)
#   ./scripts/verificar-semana.sh NN    # autograding dentro de client
#
# Topología:
#   client ── red publica ── server ── red datos ── db (PostgreSQL)
#                         └─ bastion ── red privada ── interno
# db solo es alcanzable desde server: client llega por un túnel (semana 08).
# interno no es alcanzable desde client: solo a través de bastion (semana 09).
x-servidor: &servidor
  build: lab
  image: bc-ssh-lab:24.04
  command: start-sshd

services:
  server:
    <<: *servidor
    hostname: server
    networks: [publica, datos]

  bastion:
    <<: *servidor
    hostname: bastion
    networks: [publica, privada]

  interno:
    <<: *servidor
    hostname: interno
    networks: [privada]

  # Qué: PostgreSQL con la base `tienda` (lab/db/*.sql la rellena al crearse).
  # Para qué: un servicio real al que solo llega server, como la base de datos
  #   de producción que no escucha en Internet (semana 08).
  # Impacto: usuario alumno, contraseña alumno, SOLO para el laboratorio.
  db:
    image: postgres:17.6-alpine
    hostname: db
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: alumno
      POSTGRES_DB: tienda
    volumes:
      - ./lab/db:/docker-entrypoint-initdb.d:ro
    networks: [datos]

  client:
    build: lab
    image: bc-ssh-lab:24.04
    hostname: client
    user: alumno
    tty: true
    stdin_open: true
    working_dir: /bc-ssh
    volumes:
      - .:/bc-ssh
    networks: [publica]
    depends_on: [server, bastion, interno, db]

networks:
  publica:
  privada:
    internal: true
  datos:
    internal: true
