<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
      .box-source { fill: #1a2332; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .box-dest { fill: #1a2832; stroke: #3fb950; stroke-width: 2; rx: 8; }
      .box-transfer { fill: #2a1a22; stroke: #f85149; stroke-width: 2; rx: 8; }
      .box-checksum { fill: #21262d; stroke: #d29922; stroke-width: 1; rx: 4; }
      .title { fill: #c9d1d9; font-family: sans-serif; font-size: 22px; font-weight: bold; }
      .subtitle { fill: #8b949e; font-family: sans-serif; font-size: 13px; }
      .header { fill: #c9d1d9; font-family: sans-serif; font-size: 16px; font-weight: bold; }
      .text { fill: #c9d1d9; font-family: sans-serif; font-size: 12px; }
      .text-small { fill: #8b949e; font-family: sans-serif; font-size: 10px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .accent-blue { fill: #58a6ff; }
      .accent-green { fill: #3fb950; }
      .accent-red { fill: #f85149; }
      .accent-yellow { fill: #d29922; }
      .block-same { fill: #238636; stroke: #3fb950; stroke-width: 1; rx: 2; }
      .block-diff { fill: #8b1a1a; stroke: #f85149; stroke-width: 1; rx: 2; }
      .block-new { fill: #1a4a8b; stroke: #58a6ff; stroke-width: 1; rx: 2; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-data { stroke: #f85149; stroke-width: 3; fill: none; marker-end: url(#arrowhead-red); }
      .step-number { fill: #0d1117; font-family: sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f85149"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="850" height="600"/>
  
  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" class="title">Algoritmo Delta de rsync</text>
  <text x="425" y="55" text-anchor="middle" class="subtitle">Transferencia Eficiente: Solo las Diferencias</text>
  
  <!-- Step 1: File Comparison -->
  <rect x="30" y="75" width="790" height="145" class="box"/>
  <circle cx="55" cy="100" r="14" fill="#58a6ff"/>
  <text x="55" y="105" text-anchor="middle" class="step-number">1</text>
  <text x="85" y="105" class="header">División en Bloques y Cálculo de Checksums</text>
  
  <!-- Source File -->
  <rect x="50" y="125" width="340" height="80" class="box-source"/>
  <text x="220" y="145" text-anchor="middle" class="text accent-blue">📁 Archivo Origen (Local)</text>
  
  <!-- File blocks source -->
  <rect x="70" y="158" width="55" height="35" class="block-same"/>
  <text x="98" y="180" text-anchor="middle" class="text">A</text>
  
  <rect x="135" y="158" width="55" height="35" class="block-diff"/>
  <text x="163" y="180" text-anchor="middle" class="text">B*</text>
  
  <rect x="200" y="158" width="55" height="35" class="block-same"/>
  <text x="228" y="180" text-anchor="middle" class="text">C</text>
  
  <rect x="265" y="158" width="55" height="35" class="block-new"/>
  <text x="293" y="180" text-anchor="middle" class="text">D</text>
  
  <text x="335" y="180" class="text-small">nuevo</text>
  
  <!-- Destination File -->
  <rect x="460" y="125" width="340" height="80" class="box-dest"/>
  <text x="630" y="145" text-anchor="middle" class="text accent-green">📁 Archivo Destino (Remoto)</text>
  
  <!-- File blocks dest -->
  <rect x="480" y="158" width="55" height="35" class="block-same"/>
  <text x="508" y="180" text-anchor="middle" class="text">A</text>
  
  <rect x="545" y="158" width="55" height="35" class="block-diff"/>
  <text x="573" y="180" text-anchor="middle" class="text">B</text>
  
  <rect x="610" y="158" width="55" height="35" class="block-same"/>
  <text x="638" y="180" text-anchor="middle" class="text">C</text>
  
  <text x="680" y="180" class="text-small">(sin D)</text>
  
  <!-- Step 2: Checksum Exchange -->
  <rect x="30" y="230" width="790" height="110" class="box"/>
  <circle cx="55" cy="255" r="14" fill="#58a6ff"/>
  <text x="55" y="260" text-anchor="middle" class="step-number">2</text>
  <text x="85" y="260" class="header">Intercambio de Checksums</text>
  
  <rect x="50" y="275" width="200" height="55" class="box-checksum"/>
  <text x="150" y="295" text-anchor="middle" class="text accent-yellow">Checksums Destino</text>
  <text x="150" y="313" text-anchor="middle" class="code">A:abc1 B:def2 C:ghi3</text>
  
  <path d="M 260 305 L 360 305" class="arrow"/>
  <text x="310" y="295" text-anchor="middle" class="text-small">Envía checksums</text>
  
  <rect x="370" y="275" width="230" height="55" class="box-checksum"/>
  <text x="485" y="295" text-anchor="middle" class="text accent-yellow">Comparación en Origen</text>
  <text x="485" y="313" text-anchor="middle" class="code">A:abc1✓ B:xyz9✗ C:ghi3✓ D:new</text>
  
  <rect x="620" y="275" width="180" height="55" class="box"/>
  <text x="710" y="295" text-anchor="middle" class="text">Resultado:</text>
  <text x="710" y="313" text-anchor="middle" class="text-small accent-red">Solo transferir B* y D</text>
  
  <!-- Step 3: Delta Transfer -->
  <rect x="30" y="350" width="790" height="120" class="box"/>
  <circle cx="55" cy="375" r="14" fill="#58a6ff"/>
  <text x="55" y="380" text-anchor="middle" class="step-number">3</text>
  <text x="85" y="380" class="header">Transferencia Delta (Solo Diferencias)</text>
  
  <rect x="50" y="395" width="150" height="60" class="box-source"/>
  <text x="125" y="415" text-anchor="middle" class="text accent-blue">Origen</text>
  <rect x="70" y="425" width="40" height="20" class="block-diff"/>
  <text x="90" y="440" text-anchor="middle" class="text-small">B*</text>
  <rect x="120" y="425" width="40" height="20" class="block-new"/>
  <text x="140" y="440" text-anchor="middle" class="text-small">D</text>
  
  <path d="M 220 430 L 410 430" class="arrow-data" stroke-width="4"/>
  <text x="315" y="420" text-anchor="middle" class="text accent-red">Solo bloques B* y D</text>
  <text x="315" y="450" text-anchor="middle" class="text-small">(A y C ya existen en destino)</text>
  
  <rect x="430" y="395" width="180" height="60" class="box-transfer"/>
  <text x="520" y="415" text-anchor="middle" class="text accent-red">🔄 Datos Transferidos</text>
  <text x="520" y="440" text-anchor="middle" class="text-small">~50% del archivo total</text>
  
  <rect x="640" y="395" width="160" height="60" class="box-dest"/>
  <text x="720" y="415" text-anchor="middle" class="text accent-green">Destino Reconstruido</text>
  <text x="720" y="440" text-anchor="middle" class="text-small">A + B* + C + D</text>
  
  <!-- Legend and Savings -->
  <rect x="30" y="480" width="390" height="105" class="box"/>
  <text x="225" y="505" text-anchor="middle" class="header">📊 Ahorro de Ancho de Banda</text>
  
  <rect x="50" y="520" width="160" height="25" fill="#f85149" rx="4"/>
  <text x="130" y="537" text-anchor="middle" class="text">Sin rsync: 100%</text>
  
  <rect x="50" y="550" width="80" height="25" fill="#3fb950" rx="4"/>
  <text x="90" y="567" text-anchor="middle" class="text">rsync</text>
  <text x="150" y="567" class="text-small">~50% (solo cambios)</text>
  
  <!-- Block Legend -->
  <rect x="430" y="480" width="390" height="105" class="box"/>
  <text x="625" y="505" text-anchor="middle" class="header">Leyenda de Bloques</text>
  
  <rect x="450" y="520" width="30" height="20" class="block-same"/>
  <text x="490" y="535" class="text">Bloque sin cambios (no se transfiere)</text>
  
  <rect x="450" y="548" width="30" height="20" class="block-diff"/>
  <text x="490" y="563" class="text">Bloque modificado (se transfiere)</text>
  
  <rect x="640" y="520" width="30" height="20" class="block-new"/>
  <text x="680" y="535" class="text">Bloque nuevo (se transfiere)</text>
</svg>
