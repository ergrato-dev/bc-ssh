<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
      .box-client { fill: #1a2332; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .box-server { fill: #1a2832; stroke: #3fb950; stroke-width: 2; rx: 8; }
      .box-command { fill: #21262d; stroke: #6e7681; stroke-width: 1; rx: 4; }
      .title { fill: #c9d1d9; font-family: sans-serif; font-size: 22px; font-weight: bold; }
      .subtitle { fill: #8b949e; font-family: sans-serif; font-size: 13px; }
      .header { fill: #c9d1d9; font-family: sans-serif; font-size: 16px; font-weight: bold; }
      .text { fill: #c9d1d9; font-family: sans-serif; font-size: 12px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .text-small { fill: #8b949e; font-family: sans-serif; font-size: 10px; }
      .accent-blue { fill: #58a6ff; }
      .accent-green { fill: #3fb950; }
      .accent-yellow { fill: #d29922; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-response { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); stroke-dasharray: 5,3; }
      .step-number { fill: #0d1117; font-family: sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="800" height="550"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Flujo de Sesión SFTP</text>
  <text x="400" y="55" text-anchor="middle" class="subtitle">Conexión Interactiva con el Servidor</text>
  
  <!-- Client Side -->
  <rect x="30" y="80" width="250" height="440" class="box-client"/>
  <text x="155" y="105" text-anchor="middle" class="header accent-blue">💻 Cliente Local</text>
  
  <!-- Server Side -->
  <rect x="520" y="80" width="250" height="440" class="box-server"/>
  <text x="645" y="105" text-anchor="middle" class="header accent-green">🖥️ Servidor Remoto</text>
  
  <!-- Step 1: Connection -->
  <circle cx="50" cy="145" r="14" fill="#58a6ff"/>
  <text x="50" y="150" text-anchor="middle" class="step-number">1</text>
  <rect x="70" y="130" width="195" height="35" class="box-command"/>
  <text x="168" y="152" text-anchor="middle" class="code">sftp usuario@servidor</text>
  
  <path d="M 280 147 L 500 147" class="arrow"/>
  <text x="390" y="140" text-anchor="middle" class="text-small">Solicitud conexión SSH</text>
  
  <rect x="535" y="130" width="220" height="35" class="box-command"/>
  <text x="645" y="147" text-anchor="middle" class="text">Autenticación</text>
  <text x="645" y="160" text-anchor="middle" class="text-small">llaves / contraseña</text>
  
  <!-- Step 2: Session Established -->
  <circle cx="50" cy="200" r="14" fill="#58a6ff"/>
  <text x="50" y="205" text-anchor="middle" class="step-number">2</text>
  <rect x="70" y="185" width="195" height="35" class="box-command"/>
  <text x="168" y="202" text-anchor="middle" class="text">Prompt interactivo</text>
  <text x="168" y="215" text-anchor="middle" class="code">sftp></text>
  
  <path d="M 500 200 L 280 200" class="arrow-response"/>
  <text x="390" y="193" text-anchor="middle" class="text-small accent-green">Sesión establecida</text>
  
  <rect x="535" y="185" width="220" height="35" class="box-command"/>
  <text x="645" y="207" text-anchor="middle" class="text">sftp-server activo</text>
  
  <!-- Step 3: Navigate -->
  <circle cx="50" cy="260" r="14" fill="#58a6ff"/>
  <text x="50" y="265" text-anchor="middle" class="step-number">3</text>
  <rect x="70" y="240" width="195" height="45" class="box-command"/>
  <text x="168" y="257" text-anchor="middle" class="code">cd /var/www</text>
  <text x="168" y="275" text-anchor="middle" class="code">ls -la</text>
  
  <path d="M 280 262 L 500 262" class="arrow"/>
  <text x="390" y="255" text-anchor="middle" class="text-small">Comandos remotos</text>
  
  <rect x="535" y="240" width="220" height="45" class="box-command"/>
  <text x="645" y="260" text-anchor="middle" class="text">Ejecuta en servidor</text>
  <text x="645" y="278" text-anchor="middle" class="text-small">Listado de archivos</text>
  
  <!-- Step 4: Download -->
  <circle cx="50" cy="325" r="14" fill="#58a6ff"/>
  <text x="50" y="330" text-anchor="middle" class="step-number">4</text>
  <rect x="70" y="305" width="195" height="45" class="box-command"/>
  <text x="168" y="322" text-anchor="middle" class="code">get archivo.txt</text>
  <text x="168" y="340" text-anchor="middle" class="text-small">Descarga archivo</text>
  
  <path d="M 280 327 L 500 327" class="arrow"/>
  <text x="390" y="320" text-anchor="middle" class="text-small">Solicitud GET</text>
  
  <path d="M 500 335 L 280 335" class="arrow-response"/>
  <text x="390" y="350" text-anchor="middle" class="text-small accent-green">Datos del archivo</text>
  
  <rect x="535" y="305" width="220" height="45" class="box-command"/>
  <text x="645" y="327" text-anchor="middle" class="text">Lee archivo</text>
  <text x="645" y="343" text-anchor="middle" class="text-small">Envía contenido</text>
  
  <!-- Step 5: Upload -->
  <circle cx="50" cy="390" r="14" fill="#58a6ff"/>
  <text x="50" y="395" text-anchor="middle" class="step-number">5</text>
  <rect x="70" y="370" width="195" height="45" class="box-command"/>
  <text x="168" y="387" text-anchor="middle" class="code">put local.txt</text>
  <text x="168" y="405" text-anchor="middle" class="text-small">Sube archivo</text>
  
  <path d="M 280 392 L 500 392" class="arrow"/>
  <text x="390" y="385" text-anchor="middle" class="text-small">PUT + datos del archivo</text>
  
  <path d="M 500 400 L 280 400" class="arrow-response"/>
  <text x="390" y="415" text-anchor="middle" class="text-small accent-green">Confirmación OK</text>
  
  <rect x="535" y="370" width="220" height="45" class="box-command"/>
  <text x="645" y="392" text-anchor="middle" class="text">Escribe archivo</text>
  <text x="645" y="408" text-anchor="middle" class="text-small">Confirma recepción</text>
  
  <!-- Step 6: Exit -->
  <circle cx="50" cy="455" r="14" fill="#58a6ff"/>
  <text x="50" y="460" text-anchor="middle" class="step-number">6</text>
  <rect x="70" y="435" width="195" height="45" class="box-command"/>
  <text x="168" y="455" text-anchor="middle" class="code">bye</text>
  <text x="168" y="472" text-anchor="middle" class="text-small">Cierra sesión</text>
  
  <path d="M 280 457 L 500 457" class="arrow"/>
  <text x="390" y="450" text-anchor="middle" class="text-small">Cerrar conexión</text>
  
  <rect x="535" y="435" width="220" height="45" class="box-command"/>
  <text x="645" y="455" text-anchor="middle" class="text">Termina sftp-server</text>
  <text x="645" y="472" text-anchor="middle" class="text-small">Libera recursos</text>
  
  <!-- Legend -->
  <rect x="300" y="500" width="200" height="40" class="box"/>
  <text x="400" y="518" text-anchor="middle" class="text-small">Leyenda:</text>
  <path d="M 320 530 L 360 530" class="arrow"/>
  <text x="380" y="533" class="text-small">Solicitud</text>
  <path d="M 420 530 L 460 530" class="arrow-response"/>
  <text x="480" y="533" class="text-small">Respuesta</text>
</svg>
