# Hosts del laboratorio (compose.yaml).
#
# Qué: la llave que prueba ssh con los hosts del laboratorio (bin/key-new lab).
# Para qué: entrar sin contraseña y saber siempre qué llave usa cada host.
# Impacto: si el archivo no existe, ssh lo ignora y pasa a la contraseña.
Host lab-server
    HostName server
    User alumno
    IdentityFile ~/.ssh/lab

Host lab-bastion
    HostName bastion
    User alumno
    IdentityFile ~/.ssh/lab
