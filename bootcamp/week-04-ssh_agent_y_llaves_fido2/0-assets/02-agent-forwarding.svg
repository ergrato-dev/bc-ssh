<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">ssh -A: un socket en el servidor que llega hasta tu agente</text>

  <!-- client -->
  <rect x="30" y="70" width="230" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="145" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">client</text>
  <rect x="55" y="120" width="180" height="56" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="145" y="144" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">ssh-agent</text>
  <text x="145" y="163" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">la privada sigue aquí</text>
  <text x="145" y="210" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">ssh -A server</text>

  <!-- server -->
  <rect x="335" y="70" width="230" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">server</text>
  <rect x="360" y="120" width="180" height="56" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="144" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">socket de sshd</text>
  <text x="450" y="163" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">SSH_AUTH_SOCK en server</text>
  <text x="450" y="210" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">ssh bastion</text>

  <!-- bastion -->
  <rect x="640" y="70" width="230" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="755" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">bastion</text>
  <text x="755" y="144" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">recibe una firma hecha</text>
  <text x="755" y="164" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">por el agente de client</text>

  <!-- conexiones -->
  <line x1="262" y1="230" x2="333" y2="230" stroke="#58a6ff" stroke-width="3"/>
  <text x="297" y="250" font-family="sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">cifrada</text>
  <line x1="567" y1="230" x2="638" y2="230" stroke="#58a6ff" stroke-width="3"/>
  <text x="602" y="250" font-family="sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">cifrada</text>
  <path d="M358,148 L237,148" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#fa)"/>
  <text x="297" y="138" font-family="sans-serif" font-size="11" fill="#d29922" text-anchor="middle">pide firma</text>

  <!-- riesgo -->
  <rect x="335" y="300" width="230" height="70" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="450" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f85149" text-anchor="middle">root de server</text>
  <text x="450" y="350" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">también puede abrir el socket</text>
  <line x1="450" y1="298" x2="450" y2="178" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#fa)"/>

  <!-- medidas -->
  <rect x="30" y="395" width="840" height="65" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="420" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">Medidas: ForwardAgent no por defecto · ProxyJump para saltar (semana 09)</text>
  <text x="450" y="442" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">ssh-add -h limita el camino · ssh-add -c confirma cada firma · ssh-add -t caduca la llave</text>
</svg>
