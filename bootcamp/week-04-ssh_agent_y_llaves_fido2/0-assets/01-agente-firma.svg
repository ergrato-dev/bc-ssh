<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">ssh pide la firma al agente; la privada no sale de él</text>

  <!-- Equipo del cliente -->
  <rect x="30" y="56" width="530" height="394" rx="8" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="48" y="80" font-family="sans-serif" font-size="14" fill="#8b949e">Tu equipo (client)</text>

  <rect x="60" y="95" width="220" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">ssh</text>
  <text x="170" y="149" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">lee SSH_AUTH_SOCK</text>
  <text x="170" y="169" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">no abre la privada</text>

  <rect x="60" y="235" width="220" height="50" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="170" y="256" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">socket Unix (600)</text>
  <text x="170" y="275" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">/tmp/ssh-XXXX/agent.N</text>

  <rect x="60" y="335" width="220" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="170" y="365" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">ssh-agent</text>
  <text x="170" y="389" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">privada descifrada</text>
  <text x="170" y="409" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">en memoria</text>

  <!-- 2 y 3 -->
  <line x1="110" y1="187" x2="110" y2="333" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="230" y1="333" x2="230" y2="187" stroke="#3fb950" stroke-width="2" marker-end="url(#fv)"/>
  <text x="300" y="215" font-family="sans-serif" font-size="12" fill="#c9d1d9">2. firma estos datos</text>
  <text x="300" y="231" font-family="sans-serif" font-size="12" fill="#c9d1d9">con esta llave pública</text>
  <text x="300" y="300" font-family="sans-serif" font-size="12" fill="#3fb950">3. devuelve solo la firma</text>

  <rect x="300" y="335" width="240" height="90" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="362" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Quien abra el socket (tu usuario</text>
  <text x="420" y="381" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">o root) puede pedir firmas; ninguna</text>
  <text x="420" y="400" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">operación devuelve la privada</text>

  <!-- Servidor -->
  <rect x="640" y="95" width="230" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="755" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">sshd (server)</text>
  <text x="755" y="149" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">verifica con la pública</text>
  <text x="755" y="169" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">de authorized_keys</text>

  <line x1="638" y1="120" x2="282" y2="120" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <text x="460" y="112" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">1. PK_OK: acepto esa llave, firma</text>
  <line x1="282" y1="160" x2="638" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#fv)"/>
  <text x="460" y="180" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">4. la firma viaja al servidor</text>
</svg>
