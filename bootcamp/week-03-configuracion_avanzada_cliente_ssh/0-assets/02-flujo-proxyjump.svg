<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#0d1117"/>
  
  <!-- Título -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Flujo de Conexión con ProxyJump</text>
  
  <!-- Tu equipo -->
  <rect x="50" y="180" width="140" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Tu Equipo</text>
  <text x="120" y="245" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">~/.ssh/config</text>
  <text x="120" y="265" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">ssh interno</text>
  
  <!-- Internet -->
  <rect x="220" y="200" width="80" height="60" rx="30" fill="#161b22" stroke="#d29922" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="237" font-family="Arial, sans-serif" font-size="12" fill="#d29922" text-anchor="middle">Internet</text>
  
  <!-- Bastion -->
  <rect x="330" y="160" width="160" height="140" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="410" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#238636" text-anchor="middle">BASTION</text>
  <text x="410" y="220" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">203.0.113.10</text>
  <text x="410" y="245" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Puerto: 22</text>
  <text x="410" y="265" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Usuario: admin</text>
  <text x="410" y="285" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">ProxyJump aquí</text>
  
  <!-- Firewall -->
  <line x1="520" y="120" x2="520" y2="340" stroke="#da3633" stroke-width="3"/>
  <text x="530" y="235" font-family="Arial, sans-serif" font-size="11" fill="#da3633" transform="rotate(90 530 235)">FIREWALL</text>
  
  <!-- Red privada label -->
  <rect x="560" y="120" width="300" height="30" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="710" y="140" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Red Privada (10.0.1.0/24)</text>
  
  <!-- Servidor interno -->
  <rect x="590" y="180" width="140" height="100" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="660" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8957e5" text-anchor="middle">Interno</text>
  <text x="660" y="240" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">10.0.1.50</text>
  <text x="660" y="260" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Usuario: deploy</text>
  
  <!-- Servidor DB -->
  <rect x="760" y="180" width="100" height="100" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="810" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8957e5" text-anchor="middle">DB</text>
  <text x="810" y="240" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">10.0.1.60</text>
  
  <!-- Flechas de conexión -->
  <!-- Paso 1: Tu equipo a Internet -->
  <line x1="190" y="230" x2="218" y2="230" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="218,230 208,225 208,235" fill="#58a6ff"/>
  
  <!-- Paso 2: Internet a Bastion -->
  <line x1="300" y="230" x2="328" y2="230" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="328,230 318,225 318,235" fill="#58a6ff"/>
  
  <!-- Paso 3: Bastion a Interno (a través de firewall) -->
  <line x1="490" y="230" x2="588" y2="230" stroke="#238636" stroke-width="2"/>
  <polygon points="588,230 578,225 578,235" fill="#238636"/>
  
  <!-- Etiquetas de pasos -->
  <circle cx="205" cy="195" r="14" fill="#58a6ff"/>
  <text x="205" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">1</text>
  
  <circle cx="315" cy="195" r="14" fill="#58a6ff"/>
  <text x="315" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">2</text>
  
  <circle cx="555" cy="195" r="14" fill="#238636"/>
  <text x="555" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">3</text>
  
  <!-- Comando -->
  <rect x="50" y="360" width="400" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="385" font-family="monospace" font-size="12" fill="#238636"># Configuración en ~/.ssh/config</text>
  <text x="70" y="405" font-family="monospace" font-size="12" fill="#c9d1d9">Host interno</text>
  <text x="90" y="425" font-family="monospace" font-size="12" fill="#8957e5">ProxyJump</text>
  <text x="175" y="425" font-family="monospace" font-size="12" fill="#c9d1d9">bastion</text>
  
  <!-- Alternativa CLI -->
  <rect x="470" y="360" width="380" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="385" font-family="monospace" font-size="12" fill="#238636"># O con flag -J</text>
  <text x="490" y="410" font-family="monospace" font-size="12" fill="#d29922">ssh</text>
  <text x="520" y="410" font-family="monospace" font-size="12" fill="#58a6ff">-J</text>
  <text x="545" y="410" font-family="monospace" font-size="12" fill="#c9d1d9">admin@bastion deploy@10.0.1.50</text>
  
  <!-- Leyenda -->
  <text x="50" y="460" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">El bastion actúa como puente seguro entre Internet y la red privada</text>
  <text x="50" y="480" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Los servidores internos NO tienen IP pública - solo accesibles vía bastion</text>
</svg>
