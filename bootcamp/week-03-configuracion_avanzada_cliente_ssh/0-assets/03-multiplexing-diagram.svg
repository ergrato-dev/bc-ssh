<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550">
  <rect width="850" height="550" fill="#0d1117"/>
  
  <!-- Título -->
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#c9d1d9" text-anchor="middle">SSH Multiplexing - Reutilización de Conexiones</text>
  
  <!-- SIN MULTIPLEXING -->
  <text x="215" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#da3633" text-anchor="middle">❌ Sin Multiplexing</text>
  
  <!-- Cliente sin multiplex -->
  <rect x="30" y="100" width="100" height="180" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="80" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Cliente</text>
  
  <!-- Terminales sin multiplex -->
  <rect x="45" y="140" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="157" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 1</text>
  
  <rect x="45" y="175" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="192" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 2</text>
  
  <rect x="45" y="210" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="227" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 3</text>
  
  <!-- Servidor sin multiplex -->
  <rect x="300" y="100" width="100" height="180" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="350" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Servidor</text>
  
  <!-- Conexiones separadas -->
  <line x1="130" y="152" x2="300" y2="152" stroke="#da3633" stroke-width="2"/>
  <line x1="130" y="187" x2="300" y2="187" stroke="#da3633" stroke-width="2"/>
  <line x1="130" y="222" x2="300" y2="222" stroke="#da3633" stroke-width="2"/>
  
  <!-- Tiempos -->
  <text x="215" y="145" font-family="monospace" font-size="9" fill="#da3633" text-anchor="middle">1.2s (auth)</text>
  <text x="215" y="180" font-family="monospace" font-size="9" fill="#da3633" text-anchor="middle">1.2s (auth)</text>
  <text x="215" y="215" font-family="monospace" font-size="9" fill="#da3633" text-anchor="middle">1.2s (auth)</text>
  
  <!-- Total sin multiplex -->
  <rect x="145" y="250" width="140" height="30" rx="4" fill="#161b22" stroke="#da3633" stroke-width="1"/>
  <text x="215" y="270" font-family="Arial, sans-serif" font-size="12" fill="#da3633" text-anchor="middle">Total: ~3.6 segundos</text>
  
  <!-- CON MULTIPLEXING -->
  <text x="635" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#238636" text-anchor="middle">✅ Con Multiplexing</text>
  
  <!-- Cliente con multiplex -->
  <rect x="450" y="100" width="100" height="180" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Cliente</text>
  
  <!-- Terminales con multiplex -->
  <rect x="465" y="140" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="157" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 1</text>
  
  <rect x="465" y="175" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="192" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 2</text>
  
  <rect x="465" y="210" width="70" height="25" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="227" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Terminal 3</text>
  
  <!-- Socket de control -->
  <rect x="570" y="150" width="80" height="70" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="610" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8957e5" text-anchor="middle">Socket</text>
  <text x="610" y="190" font-family="monospace" font-size="8" fill="#c9d1d9" text-anchor="middle">Control</text>
  <text x="610" y="205" font-family="monospace" font-size="8" fill="#c9d1d9" text-anchor="middle">Master</text>
  
  <!-- Servidor con multiplex -->
  <rect x="720" y="100" width="100" height="180" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="770" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Servidor</text>
  
  <!-- Conexiones al socket -->
  <line x1="550" y="152" x2="570" y2="170" stroke="#58a6ff" stroke-width="1"/>
  <line x1="550" y="187" x2="570" y2="185" stroke="#58a6ff" stroke-width="1"/>
  <line x1="550" y="222" x2="570" y2="200" stroke="#58a6ff" stroke-width="1"/>
  
  <!-- Conexión única al servidor -->
  <line x1="650" y="185" x2="720" y2="185" stroke="#238636" stroke-width="3"/>
  <text x="685" y="175" font-family="monospace" font-size="9" fill="#238636" text-anchor="middle">1.2s</text>
  <text x="685" y="200" font-family="Arial, sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">(una vez)</text>
  
  <!-- Total con multiplex -->
  <rect x="565" y="250" width="140" height="30" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="635" y="270" font-family="Arial, sans-serif" font-size="12" fill="#238636" text-anchor="middle">Total: ~1.4 segundos</text>
  
  <!-- Configuración -->
  <rect x="50" y="320" width="350" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="345" font-family="monospace" font-size="12" fill="#238636"># ~/.ssh/config</text>
  <text x="70" y="365" font-family="monospace" font-size="12" fill="#d29922">Host *</text>
  <text x="90" y="385" font-family="monospace" font-size="12" fill="#8957e5">ControlMaster</text>
  <text x="210" y="385" font-family="monospace" font-size="12" fill="#c9d1d9">auto</text>
  <text x="90" y="405" font-family="monospace" font-size="12" fill="#8957e5">ControlPath</text>
  <text x="190" y="405" font-family="monospace" font-size="12" fill="#c9d1d9">~/.ssh/sockets/%C</text>
  
  <!-- Comandos útiles -->
  <rect x="450" y="320" width="350" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="345" font-family="monospace" font-size="12" fill="#238636"># Comandos de control</text>
  <text x="470" y="370" font-family="monospace" font-size="12" fill="#c9d1d9">ssh -O check servidor</text>
  <text x="680" y="370" font-family="Arial, sans-serif" font-size="10" fill="#8b949e"># Estado</text>
  <text x="470" y="395" font-family="monospace" font-size="12" fill="#c9d1d9">ssh -O exit servidor</text>
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="10" fill="#8b949e"># Cerrar</text>
  
  <!-- Comparación final -->
  <rect x="50" y="440" width="750" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="425" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Beneficios del Multiplexing</text>
  <text x="175" y="500" font-family="Arial, sans-serif" font-size="12" fill="#238636" text-anchor="middle">⚡ 10-15x más rápido</text>
  <text x="425" y="500" font-family="Arial, sans-serif" font-size="12" fill="#58a6ff" text-anchor="middle">🔐 Una sola autenticación</text>
  <text x="675" y="500" font-family="Arial, sans-serif" font-size="12" fill="#8957e5" text-anchor="middle">💾 Menos recursos</text>
</svg>
