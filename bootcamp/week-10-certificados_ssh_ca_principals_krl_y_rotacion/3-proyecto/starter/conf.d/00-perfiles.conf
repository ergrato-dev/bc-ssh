# Perfiles: se eligen al conectar con `ssh -P NOMBRE` (OpenSSH 9.4+).
#
# Van antes que los hosts y que `Host *`: el primer valor gana.

# Qué: `ssh -P sinmux HOST` abre una conexión propia, sin master.
# Para qué: probar un cambio de llave o de authorized_keys de verdad, o
#   conectar con opciones que un master ya abierto ignoraría.
# Impacto: esa conexión vuelve a hacer intercambio de llaves y autenticación.
Match tagged sinmux
    ControlMaster no
    ControlPath none
