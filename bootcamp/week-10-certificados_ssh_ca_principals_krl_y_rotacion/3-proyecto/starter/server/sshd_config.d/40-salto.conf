# ssh-infra-kit — usuarios que solo saltan a la red privada (bastion).
#
# Mismas reglas que 30-sftp.conf: el Match vale hasta el siguiente Match o
# el final de este archivo. En un servidor sin usuarios en saltadores no
# cambia nada. Pruébalo: sudo sshd -T -C user=salto | grep -E 'permit|forward'

# Qué: los usuarios del grupo saltadores solo pueden abrir un canal hasta
#   los destinos de PermitOpen; ni shell, ni comandos, ni otros reenvíos.
# Para qué: el bastion es la puerta de la red privada; quien la cruza no
#   necesita quedarse en ella. Sin shell no hay desde dónde leer sockets
#   de agentes ajenos, escanear la red o instalar herramientas.
# Impacto: crea la cuenta sin shell y en el grupo:
#   sudo useradd -m -s /usr/sbin/nologin -G saltadores salto
Match Group saltadores
    # Cualquier sesión (shell o comando) ejecuta nologin y sale con 1.
    ForceCommand /usr/sbin/nologin
    PermitTTY no
    # Qué: solo -L y -W (ProxyJump); -R no.
    # Para qué: que nadie publique en el bastion un puerto que entre en su
    #   equipo, ni le abra a la red privada una puerta hacia fuera.
    AllowTcpForwarding local
    # Qué: los únicos destinos permitidos, como host:puerto.
    # Para qué: saltar a interno por SSH, y a nada más: ni a otros puertos
    #   de interno ni a otros hosts de la red.
    # Impacto: compara el texto que pide el cliente: `-J ... interno` entra
    #   y `-J ... 172.19.0.3` no, aunque sea la misma máquina. Añade aquí
    #   cada host interno nuevo (separados por espacios).
    PermitOpen interno:22
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    # Qué: logs de depuración solo para estas cuentas.
    # Para qué: VERBOSE no dice a dónde salta nadie; DEBUG1 añade una línea
    #   "server_request_direct_tcpip: ... target interno port 22" por salto.
    # Impacto: ~15 líneas por conexión, solo de los saltadores.
    LogLevel DEBUG1
