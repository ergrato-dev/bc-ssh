<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">rsync: solo viaja el bloque que cambió</text>

  <!-- receptor -->
  <text x="40" y="84" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c9d1d9">Receptor: versión vieja</text>
  <rect x="40" y="98" width="120" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="125" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B1</text>
  <rect x="160" y="98" width="120" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="220" y="125" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B2</text>
  <rect x="280" y="98" width="120" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="340" y="125" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B3</text>
  <rect x="400" y="98" width="120" height="44" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="460" y="125" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B4</text>

  <rect x="590" y="90" width="280" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="730" y="115" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">1. envía 2 sumas por bloque</text>
  <text x="730" y="136" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">rápida (rolling) y fuerte</text>
  <line x1="730" y1="152" x2="730" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#fa)"/>

  <!-- emisor -->
  <text x="40" y="214" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c9d1d9">Emisor: versión nueva</text>
  <rect x="40" y="228" width="120" height="44" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="100" y="255" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B1</text>
  <rect x="160" y="228" width="120" height="44" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="220" y="255" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B2</text>
  <rect x="280" y="228" width="120" height="44" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="340" y="255" font-family="monospace" font-size="14" fill="#f85149" text-anchor="middle">B3 + X</text>
  <rect x="400" y="228" width="120" height="44" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="460" y="255" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">B4</text>

  <rect x="590" y="206" width="280" height="76" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="730" y="232" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">2. busca esos bloques en la</text>
  <text x="730" y="252" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">nueva, desplazándose byte</text>
  <text x="730" y="272" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">a byte</text>
  <line x1="730" y1="284" x2="730" y2="320" stroke="#58a6ff" stroke-width="2" marker-end="url(#fa)"/>

  <!-- lo que viaja -->
  <text x="40" y="320" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c9d1d9">3. Lo que viaja</text>
  <rect x="40" y="334" width="120" height="44" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="100" y="361" font-family="monospace" font-size="13" fill="#3fb950" text-anchor="middle">usa B1</text>
  <rect x="160" y="334" width="120" height="44" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="220" y="361" font-family="monospace" font-size="13" fill="#3fb950" text-anchor="middle">usa B2</text>
  <rect x="280" y="334" width="120" height="44" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="340" y="361" font-family="monospace" font-size="13" fill="#f85149" text-anchor="middle">datos: B3+X</text>
  <rect x="400" y="334" width="120" height="44" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="460" y="361" font-family="monospace" font-size="13" fill="#3fb950" text-anchor="middle">usa B4</text>

  <rect x="590" y="326" width="280" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="730" y="351" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">4. el receptor monta un</text>
  <text x="730" y="371" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">temporal y lo renombra</text>

  <text x="450" y="408" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Verde: Matched data (reutilizado). Rojo: Literal data (enviado). Lo cuenta rsync --stats.</text>
</svg>
