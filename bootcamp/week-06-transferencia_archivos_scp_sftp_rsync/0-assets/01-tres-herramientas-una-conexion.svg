<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Tres herramientas, una conexión SSH</text>

  <!-- client -->
  <rect x="30" y="64" width="250" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="155" y="92" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">client</text>
  <rect x="55" y="112" width="200" height="44" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="155" y="139" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">sftp server</text>
  <rect x="55" y="176" width="200" height="44" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="155" y="203" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">scp f server:</text>
  <rect x="55" y="240" width="200" height="44" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="155" y="267" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">rsync -a d/ server:</text>
  <rect x="55" y="304" width="200" height="44" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="155" y="331" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">scp -O f server:</text>

  <!-- tunnel -->
  <rect x="300" y="100" width="260" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="124" font-family="sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">conexión SSH (tu config, llaves,</text>
  <text x="430" y="142" font-family="sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">known_hosts, multiplexing)</text>
  <text x="430" y="170" font-family="sans-serif" font-size="14" fill="#3fb950" text-anchor="middle">subsystem sftp</text>
  <line x1="255" y1="134" x2="680" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="255" y1="198" x2="680" y2="172" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <text x="430" y="252" font-family="sans-serif" font-size="14" fill="#d29922" text-anchor="middle">exec por la shell</text>
  <line x1="255" y1="262" x2="680" y2="262" stroke="#d29922" stroke-width="2" marker-end="url(#fa)"/>
  <text x="430" y="318" font-family="sans-serif" font-size="14" fill="#f85149" text-anchor="middle">exec por la shell</text>
  <line x1="255" y1="326" x2="680" y2="336" stroke="#f85149" stroke-width="2" marker-end="url(#fa)"/>

  <!-- server -->
  <rect x="620" y="64" width="250" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="745" y="92" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">server (sshd)</text>
  <rect x="685" y="140" width="170" height="52" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="770" y="163" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">sftp-server</text>
  <text x="770" y="181" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">sin shell</text>
  <rect x="685" y="238" width="170" height="52" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="770" y="261" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">rsync --server</text>
  <text x="770" y="279" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">necesita rsync</text>
  <rect x="685" y="312" width="170" height="52" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="770" y="335" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">scp -t RUTA</text>
  <text x="770" y="353" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">la shell lee RUTA</text>

  <text x="450" y="424" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Verde: la ruta viaja como dato. Rojo: la shell del servidor la interpreta ($(...), comodines).</text>
</svg>
