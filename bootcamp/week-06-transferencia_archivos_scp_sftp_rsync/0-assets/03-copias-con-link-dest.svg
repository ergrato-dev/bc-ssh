  </defs>
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Copias con --link-dest: nombres distintos, mismo archivo</text>

  <!-- snapshots -->
  <rect x="40" y="64" width="240" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="90" font-family="monospace" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">2026-11-07/</text>
  <text x="70" y="172" font-family="monospace" font-size="14" fill="#c9d1d9">fotos.bin</text>
  <text x="70" y="128" font-family="monospace" font-size="14" fill="#c9d1d9">notas.txt</text>

  <rect x="330" y="64" width="240" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="90" font-family="monospace" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">2026-11-08/</text>
  <text x="360" y="172" font-family="monospace" font-size="14" fill="#c9d1d9">fotos.bin</text>
  <text x="360" y="128" font-family="monospace" font-size="14" fill="#c9d1d9">notas.txt</text>

  <rect x="620" y="64" width="240" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="740" y="90" font-family="monospace" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">2026-11-09/  ← latest</text>
  <text x="650" y="172" font-family="monospace" font-size="14" fill="#c9d1d9">fotos.bin</text>
  <text x="650" y="128" font-family="monospace" font-size="14" fill="#d29922">notas.txt (v2)</text>

  <!-- inodes -->
  <rect x="330" y="270" width="270" height="56" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="465" y="294" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">inodo de fotos.bin (10 MB)</text>
  <text x="465" y="314" font-family="monospace" font-size="13" fill="#3fb950" text-anchor="middle">3 nombres: ocupa 1 vez</text>
  <line x1="110" y1="178" x2="380" y2="268" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="450" y1="178" x2="450" y2="268" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="720" y1="178" x2="540" y2="268" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="40" y="360" width="250" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="165" y="390" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">inodo notas v1 (2 nombres)</text>
  <line x1="56" y1="134" x2="56" y2="358" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="346" y1="134" x2="230" y2="358" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="620" y="360" width="250" height="50" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="745" y="390" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">inodo notas v2 (1 nombre)</text>
  <line x1="845" y1="134" x2="800" y2="358" stroke="#d29922" stroke-width="2" marker-end="url(#fa)"/>

  <text x="450" y="356" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Borrar 2026-11-07/ quita un nombre;</text>
  <text x="450" y="374" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">el inodo vive mientras le quede otro.</text>
