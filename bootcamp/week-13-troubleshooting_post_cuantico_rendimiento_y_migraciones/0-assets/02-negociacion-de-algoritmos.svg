  <text x="450" y="345" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">Elegido: sntrup761x25519-sha512 (postcuántico). El orden del servidor no cuenta.</text>
  <text x="450" y="372" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">Lo mismo para host key, cifrado y MAC. Sin nada en común:</text>
  <text x="450" y="396" font-family="monospace" font-size="13" fill="#f85149" text-anchor="middle">no matching key exchange method found. Their offer: ...</text>
