<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514">
  <defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect width="900" height="514" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">Una conexión SSH, capa por capa: diagnostica de abajo arriba</text>
  <text x="250" y="70" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Qué pasa · dónde mirar</text>
  <text x="700" y="70" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">El error de esa capa</text>
  <rect x="40" y="402" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="429" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">1</text>
  <text x="90" y="429" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Configuración</text>
  <text x="440" y="429" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">ssh -G HOST</text>
  <rect x="500" y="402" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="429" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">va a otro sitio sin avisar</text>
  <line x1="462" y1="423" x2="498" y2="423" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="350" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="377" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">2</text>
  <text x="90" y="377" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Nombre</text>
  <text x="440" y="377" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">getent hosts</text>
  <rect x="500" y="350" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="377" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">Could not resolve hostname</text>
  <line x1="462" y1="371" x2="498" y2="371" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="298" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="325" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">3</text>
  <text x="90" y="325" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">TCP</text>
  <text x="440" y="325" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">nc -zv HOST 22</text>
  <rect x="500" y="298" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="325" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">Connection refused · timed out</text>
  <line x1="462" y1="319" x2="498" y2="319" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="246" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="273" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">4</text>
  <text x="90" y="273" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Banner</text>
  <text x="440" y="273" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">SSH-2.0-OpenSSH_9.6</text>
  <rect x="500" y="246" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="273" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">kex_exchange_identification</text>
  <line x1="462" y1="267" x2="498" y2="267" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="194" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="221" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">5</text>
  <text x="90" y="221" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Algoritmos</text>
  <text x="440" y="221" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">ssh -vvv: KEXINIT</text>
  <rect x="500" y="194" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="221" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">no matching ... Their offer</text>
  <line x1="462" y1="215" x2="498" y2="215" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="142" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="169" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">6</text>
  <text x="90" y="169" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Host key</text>
  <text x="440" y="169" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">known_hosts</text>
  <rect x="500" y="142" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="169" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">Host key verification failed</text>
  <line x1="462" y1="163" x2="498" y2="163" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="90" width="420" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="117" font-family="sans-serif" font-size="15" fill="#58a6ff" text-anchor="middle">7</text>
  <text x="90" y="117" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="start">Autenticación</text>
  <text x="440" y="117" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="end">ssh -v · sshd -d</text>
  <rect x="500" y="90" width="360" height="42" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="117" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">Permission denied</text>
  <line x1="462" y1="111" x2="498" y2="111" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="474" font-family="sans-serif" font-size="12" fill="#d29922" text-anchor="middle">Cada capa empieza cuando la de debajo terminó bien: si el nombre no resuelve, las llaves no llegan a probarse.</text>
</svg>
