<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <!-- Background -->
  <rect width="900" height="550" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">🔐 Flujo de Autenticación con Llaves SSH</text>
  <text x="450" y="58" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Challenge-Response con Criptografía de Llave Pública</text>

  <!-- Client Box -->
  <rect x="50" y="85" width="180" height="100" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="140" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">💻 CLIENTE</text>
  <text x="140" y="138" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Tu máquina local</text>
  <text x="140" y="158" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">🔑 Llave Privada</text>
  <text x="140" y="173" font-family="Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">~/.ssh/id_ed25519</text>

  <!-- Server Box -->
  <rect x="670" y="85" width="180" height="100" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="760" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">🖥️ SERVIDOR</text>
  <text x="760" y="138" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Servidor remoto</text>
  <text x="760" y="158" font-family="Arial, sans-serif" font-size="10" fill="#238636" text-anchor="middle">🔓 Llave Pública</text>
  <text x="760" y="173" font-family="Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">~/.ssh/authorized_keys</text>

  <!-- Arrows definitions -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f6feb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#238636"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <circle cx="70" cy="230" r="18" fill="#1f6feb"/>
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="100" y="210" width="280" height="40" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
  <text x="240" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Cliente solicita conexión</text>
  <text x="240" y="243" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">"Quiero autenticarme con llave pública"</text>
  
  <!-- Arrow 1 -->
  <line x1="385" y1="230" x2="515" y2="230" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2 -->
  <circle cx="830" cy="230" r="18" fill="#238636"/>
  <text x="830" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="520" y="210" width="280" height="40" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="660" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Servidor envía CHALLENGE</text>
  <text x="660" y="243" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Número aleatorio cifrado con tu llave pública</text>

  <!-- Arrow 2 (reverse) -->
  <line x1="515" y1="280" x2="385" y2="280" stroke="#238636" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 3 -->
  <circle cx="70" cy="330" r="18" fill="#1f6feb"/>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="100" y="310" width="280" height="40" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
  <text x="240" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Cliente DESCIFRA con llave privada</text>
  <text x="240" y="343" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Firma el challenge con su llave privada 🔑</text>

  <!-- Arrow 3 -->
  <line x1="385" y1="330" x2="515" y2="330" stroke="#d29922" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Step 4 -->
  <circle cx="830" cy="330" r="18" fill="#238636"/>
  <text x="830" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="520" y="310" width="280" height="40" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="660" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Servidor VERIFICA respuesta</text>
  <text x="660" y="343" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Usa llave pública para verificar la firma</text>

  <!-- Arrow to success -->
  <line x1="660" y1="355" x2="660" y2="390" stroke="#238636" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Step 5 - Success -->
  <rect x="300" y="395" width="300" height="50" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ PASO 5: ACCESO CONCEDIDO</text>
  <text x="450" y="437" font-family="Arial, sans-serif" font-size="11" fill="#aff5b4" text-anchor="middle">Conexión SSH establecida</text>

  <!-- Arrow from step 4 to success -->
  <line x1="520" y1="420" x2="300" y2="420" stroke="#238636" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="600" y1="420" x2="520" y2="420" stroke="#238636" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Key point box -->
  <rect x="200" y="470" width="500" height="55" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="493" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">🔑 PUNTO CLAVE: La llave privada NUNCA sale de tu máquina</text>
  <text x="450" y="512" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Solo se usa localmente para firmar el challenge. Esto hace SSH seguro.</text>

  <!-- Legend -->
  <rect x="720" y="470" width="160" height="55" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="488" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Leyenda</text>
  <circle cx="740" cy="502" r="5" fill="#1f6feb"/>
  <text x="755" y="506" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Cliente</text>
  <circle cx="810" cy="502" r="5" fill="#238636"/>
  <text x="825" y="506" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Servidor</text>
  <circle cx="775" cy="517" r="5" fill="#d29922"/>
  <text x="795" y="521" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Firma</text>
</svg>
