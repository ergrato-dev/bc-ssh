<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Intercambio de llaves (KEX)</text>

  <!-- Participantes -->
  <rect x="90" y="55" width="160" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="81" font-family="sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">Cliente</text>
  <rect x="650" y="55" width="160" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="81" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">Servidor</text>
  <line x1="170" y1="95" x2="170" y2="580" stroke="#30363d" stroke-width="2"/>
  <line x1="730" y1="95" x2="730" y2="580" stroke="#30363d" stroke-width="2"/>

  <!-- 1 KEXINIT -->
  <line x1="172" y1="125" x2="726" y2="125" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="728" y1="145" x2="174" y2="145" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#fa)"/>
  <text x="450" y="119" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">20 KEXINIT: listas por preferencia</text>
  <text x="450" y="163" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Para cada función gana el primero del cliente que el servidor soporte</text>

  <!-- 2 ECDH_INIT -->
  <line x1="172" y1="200" x2="726" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fa)"/>
  <text x="450" y="194" font-family="monospace" font-size="13" fill="#58a6ff" text-anchor="middle">30 KEX_ECDH_INIT: parte pública efímera del cliente</text>

  <!-- Cálculo en el servidor -->
  <rect x="560" y="218" width="320" height="88" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="575" y="240" font-family="sans-serif" font-size="13" fill="#c9d1d9">1. Par efímero propio</text>
  <text x="575" y="259" font-family="sans-serif" font-size="13" fill="#c9d1d9">2. Secreto compartido K</text>
  <text x="575" y="278" font-family="sans-serif" font-size="13" fill="#c9d1d9">3. H = hash(banners, KEXINIT, host key, ..., K)</text>
  <text x="575" y="297" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950">4. Firma H con la host key privada</text>

  <!-- 3 ECDH_REPLY -->
  <line x1="728" y1="335" x2="174" y2="335" stroke="#3fb950" stroke-width="1.5" marker-end="url(#fa)"/>
  <text x="450" y="329" font-family="monospace" font-size="13" fill="#3fb950" text-anchor="middle">31 KEX_ECDH_REPLY: host key pública + parte efímera + firma</text>

  <!-- Verificación en el cliente -->
  <rect x="20" y="352" width="330" height="88" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="35" y="374" font-family="sans-serif" font-size="13" fill="#c9d1d9">1. Calcula el mismo K y el mismo H</text>
  <text x="35" y="393" font-family="sans-serif" font-size="13" fill="#c9d1d9">2. Comprueba la firma con la host key</text>
  <text x="35" y="412" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d29922">3. ¿Esa host key está en known_hosts?</text>
  <text x="35" y="431" font-family="sans-serif" font-size="12" fill="#f85149">No coincide: corta aquí, sin pedir contraseña</text>

  <!-- 4 NEWKEYS -->
  <line x1="172" y1="470" x2="726" y2="470" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="728" y1="490" x2="174" y2="490" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#fa)"/>
  <text x="450" y="464" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">21 NEWKEYS: llaves derivadas de K y H</text>

  <!-- Cifrado -->
  <rect x="172" y="510" width="556" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="532" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Desde aquí, todo cifrado</text>
  <text x="450" y="550" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">autenticación del usuario, canales, datos · K nunca viajó por la red</text>
</svg>
