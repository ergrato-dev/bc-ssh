<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- Background -->
  <rect width="900" height="500" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Criptografía en SSH: Simétrica vs Asimétrica</text>
  
  <!-- Symmetric Section -->
  <rect x="50" y="60" width="380" height="190" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="240" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f0883e" text-anchor="middle">🔐 Criptografía SIMÉTRICA</text>
  <text x="240" y="110" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Una llave para cifrar y descifrar</text>
  
  <!-- Symmetric diagram -->
  <rect x="80" y="130" width="60" height="40" rx="5" fill="#238636"/>
  <text x="110" y="155" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Texto</text>
  
  <text x="165" y="155" font-family="Arial, sans-serif" font-size="16" fill="#f0883e">+</text>
  
  <rect x="180" y="130" width="60" height="40" rx="5" fill="#f0883e"/>
  <text x="210" y="150" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">🔑</text>
  <text x="210" y="162" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Llave</text>
  
  <text x="265" y="155" font-family="Arial, sans-serif" font-size="16" fill="#f0883e">=</text>
  
  <rect x="280" y="130" width="80" height="40" rx="5" fill="#8957e5"/>
  <text x="320" y="155" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">🔒 Cifrado</text>
  
  <!-- Same key to decrypt -->
  <rect x="180" y="185" width="60" height="40" rx="5" fill="#f0883e"/>
  <text x="210" y="205" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">🔑</text>
  <text x="210" y="217" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Misma</text>
  
  <line x1="320" y1="175" x2="320" y2="200" stroke="#f0883e" stroke-width="2"/>
  <line x1="320" y1="200" x2="245" y2="200" stroke="#f0883e" stroke-width="2"/>
  
  <!-- Symmetric algorithms -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">Algoritmos: AES-256, ChaCha20</text>
  <text x="280" y="240" font-family="Arial, sans-serif" font-size="10" fill="#3fb950">✓ Muy rápido</text>
  
  <!-- Asymmetric Section -->
  <rect x="470" y="60" width="380" height="190" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="660" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a371f7" text-anchor="middle">🔐 Criptografía ASIMÉTRICA</text>
  <text x="660" y="110" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Par de llaves: pública + privada</text>
  
  <!-- Asymmetric diagram - Encryption -->
  <rect x="500" y="125" width="60" height="35" rx="5" fill="#238636"/>
  <text x="530" y="147" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Texto</text>
  
  <text x="580" y="147" font-family="Arial, sans-serif" font-size="14" fill="#a371f7">+</text>
  
  <rect x="595" y="125" width="75" height="35" rx="5" fill="#1f6feb"/>
  <text x="632" y="142" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">🔓 Pública</text>
  <text x="632" y="153" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">(compartida)</text>
  
  <text x="690" y="147" font-family="Arial, sans-serif" font-size="14" fill="#a371f7">=</text>
  
  <rect x="705" y="125" width="70" height="35" rx="5" fill="#8957e5"/>
  <text x="740" y="147" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">🔒 Cifrado</text>
  
  <!-- Asymmetric diagram - Decryption -->
  <rect x="705" y="175" width="70" height="35" rx="5" fill="#8957e5"/>
  <text x="740" y="197" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">🔒 Cifrado</text>
  
  <text x="690" y="197" font-family="Arial, sans-serif" font-size="14" fill="#a371f7">+</text>
  
  <rect x="595" y="175" width="75" height="35" rx="5" fill="#da3633"/>
  <text x="632" y="192" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">🔐 Privada</text>
  <text x="632" y="203" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">(secreta!)</text>
  
  <text x="580" y="197" font-family="Arial, sans-serif" font-size="14" fill="#a371f7">=</text>
  
  <rect x="500" y="175" width="60" height="35" rx="5" fill="#238636"/>
  <text x="530" y="197" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Texto</text>
  
  <!-- Asymmetric algorithms -->
  <text x="500" y="240" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">Algoritmos: Ed25519, RSA</text>
  <text x="700" y="240" font-family="Arial, sans-serif" font-size="10" fill="#f0883e">⚠️ Más lento</text>
  
  <!-- How SSH Uses Both -->
  <rect x="50" y="270" width="800" height="200" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">🔄 Cómo SSH Usa AMBOS Tipos</text>
  
  <!-- Step 1 -->
  <circle cx="120" cy="340" r="20" fill="#8957e5"/>
  <text x="120" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="120" y="380" font-family="Arial, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle">Intercambio</text>
  <text x="120" y="395" font-family="Arial, sans-serif" font-size="10" fill="#a371f7" text-anchor="middle">de llaves</text>
  <text x="120" y="410" font-family="Arial, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">(Asimétrica)</text>
  
  <!-- Arrow 1-2 -->
  <line x1="150" y1="340" x2="260" y2="340" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="260,335 275,340 260,345" fill="#58a6ff"/>
  
  <!-- Step 2 -->
  <circle cx="310" cy="340" r="20" fill="#238636"/>
  <text x="310" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="310" y="380" font-family="Arial, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">Genera llave</text>
  <text x="310" y="395" font-family="Arial, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">de sesión</text>
  <text x="310" y="410" font-family="Arial, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">(Diffie-Hellman)</text>
  
  <!-- Arrow 2-3 -->
  <line x1="340" y1="340" x2="450" y2="340" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="450,335 465,340 450,345" fill="#58a6ff"/>
  
  <!-- Step 3 -->
  <circle cx="500" cy="340" r="20" fill="#f0883e"/>
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="10" fill="#f0883e" text-anchor="middle">Cifrado de</text>
  <text x="500" y="395" font-family="Arial, sans-serif" font-size="10" fill="#f0883e" text-anchor="middle">sesión</text>
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">(Simétrica)</text>
  
  <!-- Arrow 3-4 -->
  <line x1="530" y1="340" x2="640" y2="340" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="640,335 655,340 640,345" fill="#58a6ff"/>
  
  <!-- Step 4 -->
  <circle cx="690" cy="340" r="20" fill="#1f6feb"/>
  <text x="690" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="690" y="380" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Comunicación</text>
  <text x="690" y="395" font-family="Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">rápida y segura</text>
  <text x="690" y="410" font-family="Arial, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">(AES-256)</text>
  
  <!-- Result icon -->
  <rect x="750" y="325" width="80" height="30" rx="5" fill="#238636"/>
  <text x="790" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ Seguro</text>
  
  <!-- Summary -->
  <text x="450" y="450" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Asimétrica: segura para intercambio inicial • Simétrica: rápida para datos de sesión</text>
</svg>