# ssh-infra-kit — segundo factor (TOTP) para los usuarios del grupo dosfa.
#
# Va con server/pam.d/sshd: sshd pregunta el código a través de PAM.
# Cada usuario crea su secreto en el servidor con google-authenticator.
# Prueba qué le toca a alguien: sudo sshd -T -C user=ana | grep -i auth

# Qué: la regla solo vale para quien esté en el grupo dosfa.
# Para qué: activar el segundo factor persona a persona; el resto sigue
#   entrando solo con llave mientras se da de alta.
# Impacto: añade a alguien al grupo DESPUÉS de que cree su secreto: sin
#   ~/.google_authenticator, PAM le rechaza el código y no entra.
Match Group dosfa
    # Qué: sshd puede hacer preguntas a través de PAM.
    # Para qué: el código TOTP se pide como "Verification code:".
    # Impacto: 10-acceso.conf lo deja en no para todos los demás.
    KbdInteractiveAuthentication yes
    # Qué: hacen falta las dos cosas, en este orden: llave Y código.
    # Para qué: quien roba la llave no tiene el móvil; quien ve el código
    #   no tiene la llave.
    # Impacto: el cliente necesita una terminal para escribir el código:
    #   BatchMode, scripts y cron dejan de entrar con estas cuentas.
    AuthenticationMethods publickey,keyboard-interactive
