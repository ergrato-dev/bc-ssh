# ssh-infra-kit — qué puede hacer una sesión ya abierta.

# Qué: sin reenvío de X11 ni del agente.
# Para qué: X11 deja que el servidor abra ventanas y lea el teclado en tu
#   escritorio; el agente reenviado deja que root en el servidor use tus
#   llaves (semana 04). Ninguno hace falta en un servidor.
# Impacto: `ssh -X` y `ssh -A` conectan, pero sin reenvío. El reenvío de
#   puertos (-L, -R, ProxyJump) sigue: lo usan las semanas 08 y 09.
X11Forwarding no
AllowAgentForwarding no

# Qué: tras 300 s sin tráfico, sshd pregunta al cliente si sigue ahí; tras
#   2 preguntas sin respuesta, corta.
# Para qué: cerrar las sesiones de equipos que se apagaron o perdieron la
#   red, que si no quedan abiertas para siempre.
# Impacto: una sesión inactiva pero viva no se corta: el cliente responde.
ClientAliveInterval 300
ClientAliveCountMax 2

# Qué: logs más detallados que INFO (el valor por defecto).
# Para qué: INFO ya dice con qué llave entró alguien; VERBOSE añade las
#   llaves rechazadas (con su huella), en qué línea de authorized_keys está
#   la que entró y qué ejecutó la sesión. Con eso sabes qué llave revocar
#   (semana 03) y ves quién prueba llaves que no son suyas.
# Impacto: unas 5 líneas más por conexión; en `docker compose logs server`
#   o `journalctl -u ssh`.
LogLevel VERBOSE
