# ssh-infra-kit — equipos viejos que no se pueden actualizar.
#
# Un switch, una cámara o un servidor con OpenSSH de hace diez años solo
# hablan algoritmos que tu ssh ya no ofrece: "no matching key exchange
# method found. Their offer: diffie-hellman-group14-sha1". Lo correcto es
# actualizarlos; mientras tanto, se les da nombre aquí.
#
# Para usarlo, un alias que empiece por legado- en este archivo:
#   Host legado-switch1
#       HostName 10.0.0.5
#       User admin
# Comprueba qué cambia: ssh -G legado-switch1 | grep -E '^(kex|hostkey|pubkey)'

# Alias del laboratorio: el equipo viejo del proyecto (paso 4), un sshd en
# server:2223. Las host keys son las de server:22, por eso HostKeyAlias.
Host legado-lab
    HostName server
    Port 2223
    User alumno
    IdentityFile ~/.ssh/lab
    HostKeyAlias server

# Qué: solo los alias legado-* aceptan, además de lo normal, los
#   algoritmos con SHA-1 que OpenSSH dejó de ofrecer.
# Para qué: entrar en lo viejo sin bajar la seguridad de todo lo demás. Con
#   "+" se AÑADEN a la lista por defecto: un equipo nuevo con el mismo
#   alias seguiría negociando lo mejor que tenga.
# Impacto: estas conexiones usan SHA-1 (roto para firmas desde 2020) y
#   ningún intercambio postcuántico: no pases por ellas nada que no
#   pasarías en claro dentro de unos años.
Host legado-*
    # Intercambio de llaves con el grupo 14 y SHA-1 (RFC 4253, 2006).
    KexAlgorithms +diffie-hellman-group14-sha1
    # Host keys RSA firmadas con SHA-1 ("ssh-rsa"), apagadas en OpenSSH 8.8.
    HostKeyAlgorithms +ssh-rsa
    # Tu llave RSA, firmada con SHA-1, para servidores sin rsa-sha2-*.
    PubkeyAcceptedAlgorithms +ssh-rsa
