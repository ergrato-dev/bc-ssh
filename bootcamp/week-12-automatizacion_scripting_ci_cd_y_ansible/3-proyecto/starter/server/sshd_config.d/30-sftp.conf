# ssh-infra-kit — usuarios que solo suben archivos.
#
# Un Match aplica sus opciones a las conexiones que cumplen la condición,
# hasta el siguiente Match o el final de ESTE archivo. La sangría no cuenta:
# es solo para leerlo. Pruébalo: sudo sshd -T -C user=NOMBRE | grep chroot

# Qué: los usuarios del grupo sftp-only solo pueden usar sftp, encerrados
#   en /srv/sftp/SU_USUARIO.
# Para qué: dar a alguien (un proveedor, una web) un sitio donde dejar
#   archivos sin darle una shell en el servidor.
# Impacto: /srv/sftp/USUARIO tiene que ser de root y no escribible por
#   nadie más (si no, sshd corta: "bad ownership or modes for chroot");
#   el usuario escribe en /srv/sftp/USUARIO/subidas, que es suya.
Match Group sftp-only
    # %u: el nombre del usuario. Dentro del chroot, / es esta carpeta.
    ChrootDirectory /srv/sftp/%u
    # Ignora lo que pida el cliente y ejecuta el servidor sftp que va
    # dentro de sshd (no necesita /usr/lib/openssh dentro del chroot).
    # -d: empieza en /subidas.
    ForceCommand internal-sftp -d /subidas
    # Sin túneles, agente, X11 ni terminal: solo archivos.
    DisableForwarding yes
    PermitTTY no
