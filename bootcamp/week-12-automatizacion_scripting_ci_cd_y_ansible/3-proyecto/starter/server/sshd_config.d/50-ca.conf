# ssh-infra-kit — certificados: quién firma a los usuarios y al servidor.
#
# Los archivos de /etc/ssh se instalan ANTES de desplegar esta carpeta
# (README del kit, "Autoridad de certificados"): sin revoked.krl, sshd
# rechaza todas las llaves y sshd-deploy deshace el cambio.

# Qué: confía en los certificados de usuario firmados por estas CA (una
#   llave pública por línea).
# Para qué: un servidor nuevo solo necesita este archivo para dejar entrar a
#   todo el equipo; una persona nueva solo necesita un certificado, no una
#   línea en el authorized_keys de cada servidor.
# Impacto: quien tenga la llave privada de una de estas CA entra como
#   cualquiera de los principals de cada usuario. Para rotar la CA, pon aquí
#   la vieja y la nueva hasta que caduque el último certificado de la vieja.
#   sshd lee el archivo en cada autenticación: cambiarlo no requiere recargar.
TrustedUserCAKeys /etc/ssh/user_ca.pub

# Qué: los principals que acepta cada cuenta, en /etc/ssh/principals/USUARIO
#   (uno por línea: el propio usuario, o roles como admins).
# Para qué: firmar con roles (admins, despliegue) en lugar de con los
#   nombres de las cuentas de cada servidor, y decidir aquí qué rol entra
#   en qué cuenta.
# Impacto: el nombre de usuario ya no basta: una cuenta sin archivo no
#   acepta ningún certificado (su authorized_keys sigue valiendo). El archivo
#   tiene que ser de root y no escribible por otros.
AuthorizedPrincipalsFile /etc/ssh/principals/%u

# Qué: llaves y certificados revocados (una KRL de ssh-keygen -k).
# Para qué: dejar fuera un certificado antes de que caduque.
# Impacto: se lee en cada autenticación: basta con copiar la KRL nueva. Si
#   el archivo falta o está roto, sshd rechaza TODAS las llaves, también las
#   de authorized_keys: súbelo siempre con install y compruébalo antes.
RevokedKeys /etc/ssh/revoked.krl

# Qué: el certificado de la host key Ed25519, firmado por la CA de hosts.
# Para qué: los clientes con una línea @cert-authority en known_hosts
#   confían en este servidor sin preguntar la primera vez, y sin avisos
#   cuando se reinstala, si se vuelve a firmar.
# Impacto: si caduca, los clientes que solo tienen la CA dejan de entrar
#   ("Certificate invalid: expired"): renuévalo antes. Si el archivo falta,
#   sshd arranca igual, sin certificado ("Could not load host certificate").
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
