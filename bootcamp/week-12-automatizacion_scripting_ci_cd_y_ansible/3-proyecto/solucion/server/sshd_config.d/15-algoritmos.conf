# ssh-infra-kit — qué algoritmos ofrece el servidor.
#
# Cada línea parte de la lista por defecto de OpenSSH y quita, con "-"
# delante, lo que ssh-audit marca como [fail] o [warn]. Admite comodines.
# Qué queda: sshd -T | grep -E '^(kexalgorithms|hostkeyalgorithms|macs)'.
# Si el servidor cumple: bin/audit HOST (política en ssh-audit-politica.txt).
#
# Por qué quitar y no escribir la lista entera: al actualizar OpenSSH entran
# solos los algoritmos nuevos (mlkem768x25519-sha256 en 9.9) y bin/audit te
# avisa si alguno no está en la política.

# Qué: sin intercambio de llaves con curvas NIST ni con grupo de 2048 bits.
# Para qué: ssh-audit marca las curvas NIST como [fail] (dudas sobre cómo se
#   eligieron sus constantes) y el grupo 14 como [warn] (2048 bits dan unos
#   112 bits de seguridad).
# Impacto: quedan sntrup761x25519 (postcuántico híbrido), curve25519 y
#   Diffie-Hellman de 3072 bits o más; cualquier OpenSSH desde 6.5 conecta.
KexAlgorithms -ecdh-sha2-nistp*,diffie-hellman-group14-sha256

# Qué: el servidor no presenta host keys ECDSA (curva NIST), tampoco la
#   variante FIDO (sk-ecdsa).
# Para qué: la misma razón que arriba; Ed25519 y RSA de 3072 bits bastan.
# Impacto: un cliente que solo guardó la llave ECDSA del servidor en
#   known_hosts verá que cambió; tu kit guarda la Ed25519 (semana 02).
HostKeyAlgorithms -ecdsa-sha2-*,sk-ecdsa-sha2-*

# Qué: sin MAC con SHA-1, con etiquetas de 64 bits ni sin "-etm".
# Para qué: SHA-1 está roto ([fail]); 64 bits es una etiqueta corta ([warn]);
#   sin "-etm" (encrypt-then-MAC) se calcula el MAC sobre el texto sin
#   cifrar ([warn]).
# Impacto: quedan hmac-sha2-256/512-etm y umac-128-etm. Los cifrados AEAD
#   (chacha20-poly1305, aes-gcm), los que se usan casi siempre, no usan MAC.
MACs -*-sha1*,umac-64*,hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com
