# ssh-infra-kit — configuración de Ansible. Ansible solo la lee si ejecutas
# los comandos desde esta carpeta (cd ansible): las rutas son relativas a ella.

[defaults]
# Qué: el inventario del kit.
# Para qué: `ansible` y `ansible-playbook` sin `-i`.
# Impacto: la variable ANSIBLE_INVENTORY lo cambia sin tocar este archivo.
inventory = inventario.ini

# Qué: el Python de los servidores, fijo.
# Para qué: Ansible no tiene que adivinarlo ni avisar en cada ejecución.
# Impacto: un servidor sin /usr/bin/python3 falla con un error claro.
interpreter_python = /usr/bin/python3

# Qué: comprobar la host key de cada servidor (es el valor por defecto).
# Para qué: dejarlo escrito para que nadie lo apague «para que funcione».
# Impacto: un servidor que no está en known_hosts, o cuya llave cambió, no se toca.
host_key_checking = True

[ssh_connection]
# Qué: los argumentos de cada `ssh`: la configuración del kit y un master que
#       dura 60 s.
# Para qué: Ansible usa los mismos alias, llaves, known_hosts y ProxyJump que tú
#           en la terminal. Con ControlPersist aquí, Ansible pone su propio
#           ControlPath (~/.ansible/cp) y sabe cerrar el master (reset_connection).
# Impacto: sustituye los argumentos por defecto de Ansible (-C y ControlMaster);
#          los masters de Ansible no se mezclan con los tuyos (~/.ssh/cm).
ssh_args = -F ../config -o ControlPersist=60s

# Qué: enviar cada módulo por la entrada de `ssh` en lugar de copiarlo antes.
# Para qué: una conexión por tarea en lugar de varias; mucho más rápido.
# Impacto: con `become`, sudo no puede exigir terminal (`requiretty`).
pipelining = True
