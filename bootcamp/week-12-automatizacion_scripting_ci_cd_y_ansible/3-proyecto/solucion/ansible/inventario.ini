# ssh-infra-kit — inventario de Ansible: los servidores que gestiona el kit.
# Cada nombre es un alias de conf.d/: el nombre real, el usuario, la llave y el
# salto salen de la configuración del kit (ssh_args en ansible.cfg), no de aquí.

# Qué: el grupo que configura servidores.yml.
# Para qué: añadir un servidor es añadir su alias (antes, en conf.d/).
# Impacto: lab-interno no está porque su acceso es la cuenta de salto; añádelo
#          cuando tu llave entre en interno (ssh -F ../config lab-interno).
[servidores]
lab-server
lab-bastion
