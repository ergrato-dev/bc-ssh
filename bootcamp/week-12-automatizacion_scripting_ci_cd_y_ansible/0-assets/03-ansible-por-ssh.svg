<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">Ansible por SSH: inventario, módulos y resultado</text>
  <rect x="30" y="70" width="260" height="270" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="96" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">Nodo de control (tu equipo)</text>
  <text x="160" y="126" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">ansible.cfg · inventario.ini</text>
  <text x="160" y="146" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">servidores.yml (tareas)</text>
  <text x="160" y="182" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">tu ssh: config, llaves,</text>
  <text x="160" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">known_hosts, ProxyJump</text>
  <text x="160" y="236" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">ControlPersist: 1 conexión</text>
  <text x="160" y="256" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">pipelining: sin archivos</text>
  <text x="160" y="300" font-family="monospace" font-size="11" fill="#d29922" text-anchor="middle">--check --diff · serial: 1</text>
  <rect x="610" y="70" width="260" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="740" y="96" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">server</text>
  <text x="740" y="124" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">sudo python3 &lt;módulo copy&gt;</text>
  <text x="740" y="150" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">sin agente instalado:</text>
  <text x="740" y="168" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">solo sshd, python3 y sudo</text>
  <rect x="610" y="220" width="260" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="740" y="246" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">bastion</text>
  <text x="740" y="274" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">sudo python3 &lt;módulo copy&gt;</text>
  <text x="740" y="300" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">uno detrás de otro</text>
  <text x="740" y="318" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">con serial: 1</text>
  <line x1="292" y1="115" x2="608" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="107" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">ssh: el módulo en Python</text>
  <line x1="608" y1="160" x2="292" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="152" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="middle">{"changed": false}  → ok</text>
  <line x1="292" y1="265" x2="608" y2="265" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="608" y1="310" x2="292" y2="310" stroke="#d29922" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="302" font-family="monospace" font-size="12" fill="#d29922" text-anchor="middle">{"changed": true}  → notify: handler</text>
  <rect x="30" y="360" width="840" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="387" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">PLAY RECAP  server : ok=11 changed=0 failed=0   ← la segunda vez, nada que cambiar</text>
</svg>
