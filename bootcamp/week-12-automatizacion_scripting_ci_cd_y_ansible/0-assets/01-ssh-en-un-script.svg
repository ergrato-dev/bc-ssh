<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">ssh dentro de un script: entrada, salidas y código</text>
  <rect x="30" y="70" width="240" height="250" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="150" y="98" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">Tu script (client)</text>
  <text x="150" y="130" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">ssh -n -o BatchMode=yes \</text>
  <text x="150" y="148" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">  -o ConnectTimeout=5 \</text>
  <text x="150" y="166" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">  server "cat x" &gt; copia</text>
  <text x="150" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">BatchMode: nunca pregunta</text>
  <text x="150" y="220" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">-n: no se come la entrada</text>
  <text x="150" y="240" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">ConnectTimeout: no espera</text>
  <text x="150" y="290" font-family="monospace" font-size="13" fill="#d29922" text-anchor="middle">echo $?</text>
  <rect x="630" y="70" width="240" height="250" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="750" y="98" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">Comando remoto (server)</text>
  <text x="750" y="130" font-family="monospace" font-size="12" fill="#c9d1d9" text-anchor="middle">bash -c "cat x"</text>
  <text x="750" y="170" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">el shell remoto vuelve a</text>
  <text x="750" y="188" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">separar los argumentos:</text>
  <text x="750" y="208" font-family="monospace" font-size="12" fill="#58a6ff" text-anchor="middle">printf %q · bash -s</text>
  <line x1="272" y1="120" x2="628" y2="120" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="112" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">entrada (stdin) → stdin remoto</text>
  <line x1="628" y1="165" x2="272" y2="165" stroke="#3fb950" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="157" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">salida (stdout)</text>
  <line x1="628" y1="210" x2="272" y2="210" stroke="#f85149" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="202" font-family="sans-serif" font-size="12" fill="#f85149" text-anchor="middle">errores (stderr): los remotos y los de ssh</text>
  <line x1="628" y1="285" x2="272" y2="285" stroke="#d29922" stroke-width="2" marker-end="url(#fa)"/>
  <text x="450" y="277" font-family="sans-serif" font-size="12" fill="#d29922" text-anchor="middle">código de salida</text>
  <rect x="300" y="300" width="300" height="60" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="324" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">0–254: el del comando remoto</text>
  <text x="450" y="344" font-family="sans-serif" font-size="12" fill="#f85149" text-anchor="middle">255: falló ssh (nombre, red, host key, llave)</text>
</svg>
