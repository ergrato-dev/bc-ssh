# ssh-infra-kit — usuarios que solo saltan a la red privada (bastion).
#
# Mismas reglas que 30-sftp.conf: el Match vale hasta el siguiente Match o
# el final de este archivo. En un servidor sin usuarios en saltadores no
# cambia nada. Pruébalo: sudo sshd -T -C user=salto | grep -E 'permit|forward'

# Qué: los usuarios del grupo saltadores solo pueden abrir un canal hasta
#   los destinos de PermitOpen; ni shell, ni comandos, ni otros reenvíos.
# Para qué: el bastion es la puerta de la red privada; quien la cruza no
#   necesita quedarse en ella. Sin shell no hay desde dónde leer sockets
#   de agentes ajenos, escanear la red o instalar herramientas.
# Impacto: crea la cuenta sin shell y en el grupo:
#   sudo useradd -m -s /usr/sbin/nologin -G saltadores salto
Match Group saltadores
