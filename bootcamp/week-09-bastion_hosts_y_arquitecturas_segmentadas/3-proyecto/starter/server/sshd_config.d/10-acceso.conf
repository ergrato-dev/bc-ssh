# ssh-infra-kit — quién entra en el servidor y cómo.
#
# sshd lee /etc/ssh/sshd_config, que empieza con
#   Include /etc/ssh/sshd_config.d/*.conf
# y usa el PRIMER valor de cada opción: lo de esta carpeta gana a lo que
# venga después en sshd_config. bin/sshd-deploy sustituye la carpeta entera
# por la del kit. Pruébalo en el servidor: sudo sshd -T | grep -i password

# Qué: solo se entra con llave.
# Para qué: una contraseña se puede adivinar probando miles por minuto; una
#   llave Ed25519, no. Es la diferencia entre aparecer en un ataque de
#   diccionario y no.
# Impacto: quien no tenga su llave pública en authorized_keys ya no entra.
#   Antes de aplicarlo, comprueba que tu llave funciona (ssh -P sinmux).
PasswordAuthentication no
# La otra forma de pedir contraseña (vía PAM). Ubuntu ya la trae en no;
# aquí queda escrita para no depender de sshd_config.
KbdInteractiveAuthentication no

# Qué: root no entra por SSH, ni con llave.
# Para qué: root existe en todos los servidores, así que es el usuario que
#   prueban todos los ataques; y con cuentas propias + sudo, los logs dicen
#   quién hizo cada cosa.
# Impacto: para administrar, entra con tu usuario y usa sudo. El valor por
#   defecto de OpenSSH es prohibit-password (root sí entra con llave).
PermitRootLogin no

# Qué: solo entran los usuarios de estos grupos.
# Para qué: una cuenta de servicio (postgres, www-data) o un usuario creado
#   para otra cosa no abre sesión SSH por accidente.
# Impacto: antes de aplicarlo, tu usuario tiene que estar en ssh-users
#   (sudo usermod -aG ssh-users TU_USUARIO) o te quedas fuera.
#   sftp-only: usuarios que solo suben archivos (30-sftp.conf).
# TODO 8: deja entrar también al grupo saltadores (40-salto.conf).
AllowGroups ssh-users sftp-only

# Qué: 3 intentos de autenticación por conexión (6 por defecto).
# Para qué: cada llave que ofrece el cliente gasta un intento; menos
#   intentos, menos pruebas por conexión.
# Impacto: un cliente con muchas llaves en el agente y sin IdentitiesOnly
#   recibe "Too many authentication failures" (por eso el kit lo usa).
MaxAuthTries 3

# Qué: 20 s para autenticarse (120 por defecto).
# Para qué: una conexión que no termina de entrar ocupa un hueco de
#   MaxStartups; con 20 s se liberan antes.
# Impacto: una persona que escribe la frase de su llave tiene 20 s.
LoginGraceTime 20

# Qué: con 10 conexiones sin autenticar, sshd empieza a rechazar el 30 %
#   de las nuevas, y con 60 las rechaza todas.
# Para qué: que un escaneo masivo no agote los huecos de quien sí entra.
# Impacto: con un ataque en curso, tu conexión puede fallar a la primera;
#   las sesiones ya abiertas no cuentan.
MaxStartups 10:30:60
