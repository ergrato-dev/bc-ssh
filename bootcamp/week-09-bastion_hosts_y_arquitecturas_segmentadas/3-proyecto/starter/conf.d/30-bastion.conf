# Red privada: hosts a los que solo se llega saltando por bastion.
#
# Qué: con ProxyJump, ssh abre primero una conexión con el salto, le pide un
#   canal hasta HOST:22 (como un -L sin puerto local) y monta dentro de ese
#   canal una segunda conexión SSH, completa, con el destino.
# Para qué: entrar en interno desde tu equipo con una sola orden, sin copiar
#   llaves al bastion ni reenviarle el agente.
# Impacto: el bastion solo ve tráfico cifrado entre tú e interno; tu equipo
#   comprueba la host key de los dos (los dos tienen que estar en
#   known_hosts: bin/kh-add bastion ... y bin/kh-add -J lab-salto interno ...).
#   Pruébalo sin conectar: ssh -G -F config lab-interno | grep proxyjump

# TODO 1: el bloque `Host lab-salto`: entra en bastion como salto, con la
#   llave ~/.ssh/lab. Escribe su Qué / Para qué / Impacto (lab 06).
Host lab-salto

Host lab-interno
    HostName interno
    User alumno
    IdentityFile ~/.ssh/lab
