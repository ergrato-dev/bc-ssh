<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450">
  <!-- Background -->
  <rect width="850" height="450" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="425" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">📄 Estructura del archivo authorized_keys</text>
  <text x="425" y="55" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">~/.ssh/authorized_keys en el servidor</text>

  <!-- File location box -->
  <rect x="50" y="75" width="750" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="12" fill="#6e7681">📁 Ubicación:</text>
  <text x="155" y="100" font-family="Arial, sans-serif" font-size="12" fill="#58a6ff">/home/usuario/.ssh/authorized_keys</text>
  <text x="480" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">Permisos: 600 | Propietario: usuario</text>

  <!-- Line format title -->
  <text x="425" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Formato de cada línea (una llave por línea)</text>

  <!-- Key line example box -->
  <rect x="50" y="160" width="750" height="80" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
  
  <!-- Algorithm part -->
  <rect x="65" y="175" width="100" height="50" rx="4" fill="#1f6feb"/>
  <text x="115" y="197" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ALGORITMO</text>
  <text x="115" y="215" font-family="Arial, sans-serif" font-size="9" fill="#c8d1d9" text-anchor="middle">ssh-ed25519</text>

  <!-- Separator -->
  <text x="175" y="205" font-family="Arial, sans-serif" font-size="20" fill="#6e7681">│</text>

  <!-- Key data part -->
  <rect x="190" y="175" width="400" height="50" rx="4" fill="#238636"/>
  <text x="390" y="197" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">LLAVE PÚBLICA (Base64)</text>
  <text x="390" y="215" font-family="Arial, sans-serif" font-size="9" fill="#aff5b4" text-anchor="middle">AAAAC3NzaC1lZDI1NTE5AAAAI...G7hK9mZ</text>

  <!-- Separator -->
  <text x="600" y="205" font-family="Arial, sans-serif" font-size="20" fill="#6e7681">│</text>

  <!-- Comment part -->
  <rect x="615" y="175" width="170" height="50" rx="4" fill="#8957e5"/>
  <text x="700" y="197" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">COMENTARIO</text>
  <text x="700" y="215" font-family="Arial, sans-serif" font-size="9" fill="#d2a8ff" text-anchor="middle">usuario@laptop</text>

  <!-- Example file content -->
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9">Ejemplo de archivo con múltiples llaves:</text>
  
  <rect x="50" y="290" width="750" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Line 1 -->
  <text x="70" y="315" font-family="Arial, sans-serif" font-size="10" fill="#6e7681"># Laptop personal</text>
  <text x="70" y="332" font-family="Arial, sans-serif" font-size="10" fill="#c9d1d9">
    <tspan fill="#1f6feb">ssh-ed25519</tspan>
    <tspan fill="#238636"> AAAAC3NzaC1...xYz</tspan>
    <tspan fill="#8957e5"> juan@laptop-personal</tspan>
  </text>
  
  <!-- Line 2 -->
  <text x="70" y="355" font-family="Arial, sans-serif" font-size="10" fill="#6e7681"># PC de trabajo</text>
  <text x="70" y="372" font-family="Arial, sans-serif" font-size="10" fill="#c9d1d9">
    <tspan fill="#1f6feb">ssh-ed25519</tspan>
    <tspan fill="#238636"> AAAAC3NzaC1...aBc</tspan>
    <tspan fill="#8957e5"> juan@pc-trabajo</tspan>
  </text>
  
  <!-- Line 3 -->
  <text x="70" y="392" font-family="Arial, sans-serif" font-size="10" fill="#6e7681"># CI/CD Pipeline (sin comentario)</text>

  <!-- Legend -->
  <rect x="50" y="410" width="750" height="35" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="100" cy="427" r="6" fill="#1f6feb"/>
  <text x="115" y="431" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">Algoritmo</text>
  <circle cx="220" cy="427" r="6" fill="#238636"/>
  <text x="235" y="431" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">Llave pública (Base64)</text>
  <circle cx="400" cy="427" r="6" fill="#8957e5"/>
  <text x="415" y="431" font-family="Arial, sans-serif" font-size="10" fill="#8b949e">Comentario (opcional)</text>
  <circle cx="560" cy="427" r="6" fill="#6e7681"/>
  <text x="575" y="431" font-family="Arial, sans-serif" font-size="10" fill="#8b949e"># = línea de comentario</text>
</svg>
