<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">🔑 Proceso de Generación de Llaves SSH</text>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">ssh-keygen -t ed25519 -C "tu@email.com"</text>

  <!-- Step 1: Command -->
  <rect x="50" y="80" width="700" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <circle cx="85" cy="110" r="18" fill="#1f6feb"/>
  <text x="85" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="120" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">Ejecutar comando ssh-keygen</text>
  <text x="120" y="125" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">$ ssh-keygen -t ed25519 -C "tu@email.com"</text>

  <!-- Arrow down -->
  <line x1="400" y1="145" x2="400" y2="165" stroke="#30363d" stroke-width="2"/>
  <polygon points="395,165 405,165 400,175" fill="#30363d"/>

  <!-- Step 2: Generate -->
  <rect x="50" y="180" width="700" height="70" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <circle cx="85" cy="215" r="18" fill="#8957e5"/>
  <text x="85" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a371f7">Generación criptográfica</text>
  <text x="120" y="220" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">Se genera un par de llaves usando curva elíptica Ed25519</text>
  <text x="120" y="238" font-family="Arial, sans-serif" font-size="10" fill="#6e7681">Entropía del sistema → Algoritmo Ed25519 → Par de llaves único</text>

  <!-- Arrow down -->
  <line x1="400" y1="255" x2="400" y2="275" stroke="#30363d" stroke-width="2"/>
  <polygon points="395,275 405,275 400,285" fill="#30363d"/>

  <!-- Step 3: Passphrase -->
  <rect x="50" y="290" width="700" height="60" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <circle cx="85" cy="320" r="18" fill="#d29922"/>
  <text x="85" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="120" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d29922">Proteger con passphrase (recomendado)</text>
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">Enter passphrase: ●●●●●●●●●●  (cifra la llave privada con AES-256)</text>

  <!-- Arrow down -->
  <line x1="400" y1="355" x2="400" y2="375" stroke="#30363d" stroke-width="2"/>
  <polygon points="395,375 405,375 400,385" fill="#30363d"/>

  <!-- Step 4: Files created -->
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9" text-anchor="middle">📁 Archivos Generados en ~/.ssh/</text>

  <!-- Private Key Box -->
  <rect x="100" y="420" width="250" height="65" rx="6" fill="#161b22" stroke="#da3633" stroke-width="2"/>
  <text x="225" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">🔒 LLAVE PRIVADA</text>
  <text x="225" y="462" font-family="Arial, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">id_ed25519</text>
  <text x="225" y="478" font-family="Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">Permisos: 600 (solo tú)</text>

  <!-- Public Key Box -->
  <rect x="450" y="420" width="250" height="65" rx="6" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="575" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">🔓 LLAVE PÚBLICA</text>
  <text x="575" y="462" font-family="Arial, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">id_ed25519.pub</text>
  <text x="575" y="478" font-family="Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">Permisos: 644 (lectura todos)</text>

  <!-- Arrows from step 4 to files -->
  <line x1="300" y1="385" x2="225" y2="415" stroke="#30363d" stroke-width="1"/>
  <line x1="500" y1="385" x2="575" y2="415" stroke="#30363d" stroke-width="1"/>

  <!-- Legend -->
  <rect x="600" y="80" width="140" height="85" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="100" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Leyenda</text>
  <circle cx="620" cy="118" r="5" fill="#da3633"/>
  <text x="635" y="122" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Privada (secreto)</text>
  <circle cx="620" cy="136" r="5" fill="#238636"/>
  <text x="635" y="140" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Pública (compartir)</text>
  <circle cx="620" cy="154" r="5" fill="#d29922"/>
  <text x="635" y="158" font-family="Arial, sans-serif" font-size="9" fill="#8b949e">Protección</text>
</svg>
