<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">TOTP: el móvil y el servidor calculan el mismo código sin hablarse</text>
  <rect x="40" y="70" width="240" height="70" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="160" y="98" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">secreto compartido (base32)</text>
  <text x="160" y="122" font-family="monospace" font-size="12" fill="#d29922" text-anchor="middle">5SOJY6NPOGVXP5K2CUNCEHIAUI</text>
  <rect x="40" y="170" width="240" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="198" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">periodo = segundos desde 1970 / 30</text>
  <text x="160" y="222" font-family="monospace" font-size="12" fill="#58a6ff" text-anchor="middle">1794347575 / 30 = 59811585</text>
  <line x1="282" y1="105" x2="378" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="282" y1="205" x2="378" y2="165" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="380" y="120" width="200" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="480" y="150" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">HMAC-SHA1</text>
  <text x="480" y="172" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">(secreto, periodo)</text>
  <line x1="582" y1="155" x2="658" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="660" y="120" width="200" height="70" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="760" y="150" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">6 cifras</text>
  <text x="760" y="174" font-family="monospace" font-size="18" fill="#3fb950" text-anchor="middle">031517</text>
  <text x="450" y="290" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">Cada 30 s cambia el periodo, y con él el código. Nada viaja entre el móvil y el servidor:</text>
  <text x="450" y="314" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">si los relojes se desvían, los códigos no coinciden (WINDOW_SIZE acepta el anterior y el siguiente).</text>
  <text x="450" y="350" font-family="sans-serif" font-size="13" fill="#f85149" text-anchor="middle">Quien copie el secreto genera tus códigos: guárdalo como una llave privada.</text>
</svg>
