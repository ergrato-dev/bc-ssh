<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">Llave y código: AuthenticationMethods publickey,keyboard-interactive</text>
  <text x="150" y="70" font-family="sans-serif" font-size="15" fill="#c9d1d9" text-anchor="middle">cliente (ssh)</text>
  <text x="450" y="70" font-family="sans-serif" font-size="15" fill="#c9d1d9" text-anchor="middle">servidor (sshd)</text>
  <text x="750" y="70" font-family="sans-serif" font-size="15" fill="#c9d1d9" text-anchor="middle">PAM (/etc/pam.d/sshd)</text>
  <rect x="40" y="90" width="220" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="117" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">1. ofrece su llave</text>
  <text x="150" y="137" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">~/.ssh/lab</text>
  <line x1="262" y1="120" x2="338" y2="120" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="340" y="90" width="220" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="117" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">llave en authorized_keys</text>
  <text x="450" y="137" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="middle">publickey: parcial</text>
  <rect x="340" y="180" width="220" height="60" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="207" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">2. falta un método:</text>
  <text x="450" y="227" font-family="monospace" font-size="12" fill="#d29922" text-anchor="middle">keyboard-interactive</text>
  <line x1="450" y1="152" x2="450" y2="178" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="562" y1="210" x2="638" y2="210" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="640" y="180" width="220" height="60" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="750" y="207" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">pam_google_authenticator</text>
  <text x="750" y="227" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">lee ~/.google_authenticator</text>
  <line x1="638" y1="230" x2="262" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="40" y="250" width="220" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="150" y="277" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">3. pregunta a la persona</text>
  <text x="150" y="297" font-family="monospace" font-size="12" fill="#c9d1d9" text-anchor="middle">Verification code:</text>
  <line x1="262" y1="300" x2="638" y2="300" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="640" y="280" width="220" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="307" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">código = secreto + hora</text>
  <text x="750" y="327" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">y no usado antes</text>
  <line x1="750" y1="342" x2="562" y2="380" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="340" y="360" width="220" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="387" font-family="sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">4. dentro</text>
  <text x="450" y="407" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">Accepted keyboard-interactive/pam</text>
  <text x="450" y="452" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Solo para Match Group dosfa. Sin llave, el servidor ni pregunta el código; con la llave sola, no entra.</text>
</svg>
