# Red privada: hosts a los que solo se llega saltando por bastion.
#
# Qué: con ProxyJump, ssh abre primero una conexión con el salto, le pide un
#   canal hasta HOST:22 (como un -L sin puerto local) y monta dentro de ese
#   canal una segunda conexión SSH, completa, con el destino.
# Para qué: entrar en interno desde tu equipo con una sola orden, sin copiar
#   llaves al bastion ni reenviarle el agente.
# Impacto: el bastion solo ve tráfico cifrado entre tú e interno; tu equipo
#   comprueba la host key de los dos (los dos tienen que estar en
#   known_hosts: bin/kh-add bastion ... y bin/kh-add -J lab-salto interno ...).
#   Pruébalo sin conectar: ssh -G -F config lab-interno | grep proxyjump

# Qué: la cuenta del bastion que solo sirve para saltar (sin shell; el
#   servidor la limita con server/sshd_config.d/40-salto.conf).
# Para qué: que quien salta no tenga una shell en el bastion desde la que
#   leer sockets de otros usuarios, probar la red privada o instalar nada.
# Impacto: `ssh lab-salto` responde "This account is currently not
#   available."; para administrar el bastion, lab-bastion (alumno).
Host lab-salto
    HostName bastion
    User salto
    IdentityFile ~/.ssh/lab

Host lab-interno
    HostName interno
    User alumno
    IdentityFile ~/.ssh/lab
    # Qué: el salto, por su alias: su HostName, User, IdentityFile y
    #   multiplexing salen de su propio bloque Host.
    # Para qué: un solo sitio donde cambiar cómo se entra en el bastion.
    # Impacto: ssh pide al salto el destino tal como está en HostName
    #   (interno); el PermitOpen del bastion compara ese texto, no la IP.
    #   Varios saltos en cadena: ProxyJump a,b. Para no saltar: -J none.
    ProxyJump lab-salto
