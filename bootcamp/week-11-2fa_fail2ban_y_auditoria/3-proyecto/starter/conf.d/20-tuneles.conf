# Túneles del kit: un host por túnel, que se abre con `bin/tunnel up NOMBRE`.
#
# Van en hosts propios (tun-*) y no en lab-server: así `ssh lab-server` sigue
# siendo una shell normal, sin abrir puertos ni fallar si el puerto está
# ocupado.

# Qué: PostgreSQL de db, que solo server alcanza, en 127.0.0.1:15432 de tu equipo.
# Para qué: usar psql o tu aplicación contra la base de datos sin que esta
#   escuche en ninguna red pública. Pruébalo: psql -h 127.0.0.1 -p 15432 -U alumno tienda
# Impacto: el tramo client-server va cifrado dentro de SSH; el tramo
#   server-db, en claro por la red datos (que solo ven server y db).
Host tun-pg
    HostName server
    User alumno
    IdentityFile ~/.ssh/lab
    # 127.0.0.1 y no solo el puerto: con GatewayPorts del cliente activo,
    # un LocalForward sin dirección escucharía en todas tus interfaces y
    # cualquiera de tu red entraría a la base de datos.
    LocalForward 127.0.0.1:15432 db:5432
    # Qué: si el puerto no se puede abrir (ocupado), ssh sale con error.
    # Para qué: sin esto, ssh se queda conectado sin túnel y autossh cree
    #   que todo va bien.
    # Impacto: bin/tunnel up detecta el fallo y no deja procesos colgados.
    ExitOnForwardFailure yes
    # Qué: cada 15 s ssh pregunta al servidor si sigue ahí; a las 3 sin
    #   respuesta (45 s) da la conexión por muerta y sale.
    # Para qué: una conexión cortada sin aviso (wifi, NAT que olvida) no
    #   da error por sí sola; esto la detecta y autossh la relanza.
    # Impacto: un poco de tráfico cada 15 s, también sin usar el túnel.
    ServerAliveInterval 15
    ServerAliveCountMax 3
    # Qué: sin shell ni comando remoto, como `ssh -N`.
    # Para qué: el túnel no abre una sesión que nadie usa ni ocupa un pty.
    # Impacto: `ssh tun-pg` se queda esperando sin prompt; Ctrl+C lo cierra.
    SessionType none
    # Qué: conexión propia, sin multiplexing.
    # Para qué: con un master abierto, ssh solo le pediría el reenvío y
    #   saldría, y autossh lo relanzaría sin parar; y un ControlPersist
    #   dejaría el túnel abierto después de `bin/tunnel down`.
    # Impacto: cada túnel es una conexión TCP más al servidor.
    ControlMaster no
    ControlPath none
