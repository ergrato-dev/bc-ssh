<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">ssh lee de arriba abajo y se queda con el primer valor</text>

  <!-- fuentes -->
  <rect x="30" y="70" width="380" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="50" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9">1. Línea de comandos</text>
  <text x="50" y="128" font-family="monospace" font-size="13" fill="#8b949e">-o User=otro  -p 2222  -i llave</text>

  <rect x="30" y="180" width="380" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="50" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9">2. ~/.ssh/config  (o -F archivo)</text>
  <text x="50" y="238" font-family="monospace" font-size="13" fill="#8b949e">Include conf.d/*.conf</text>
  <text x="50" y="258" font-family="monospace" font-size="13" fill="#8b949e">Host / Match concretos</text>
  <text x="50" y="278" font-family="monospace" font-size="13" fill="#8b949e">Host *</text>

  <rect x="30" y="330" width="380" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="50" y="360" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9">3. /etc/ssh/ssh_config</text>
  <text x="50" y="388" font-family="sans-serif" font-size="13" fill="#d29922">no se lee si usas -F</text>

  <line x1="220" y1="150" x2="220" y2="178" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="220" y1="300" x2="220" y2="328" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>

  <!-- ejemplo -->
  <rect x="470" y="70" width="400" height="340" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="490" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9">Ejemplo: ssh lab-server</text>
  <text x="490" y="140" font-family="monospace" font-size="13" fill="#c9d1d9">Host *</text>
  <text x="510" y="162" font-family="monospace" font-size="13" fill="#3fb950">User nadie</text>
  <text x="700" y="162" font-family="sans-serif" font-size="13" fill="#3fb950">gana: primero</text>
  <text x="490" y="200" font-family="monospace" font-size="13" fill="#c9d1d9">Host lab-server</text>
  <text x="510" y="222" font-family="monospace" font-size="13" fill="#3fb950">HostName server</text>
  <text x="700" y="222" font-family="sans-serif" font-size="13" fill="#3fb950">se aplica</text>
  <text x="510" y="244" font-family="monospace" font-size="13" fill="#f85149">User alumno</text>
  <text x="700" y="244" font-family="sans-serif" font-size="13" fill="#f85149">ignorado</text>
  <line x1="490" y1="275" x2="850" y2="275" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="304" font-family="sans-serif" font-size="14" fill="#c9d1d9">User ya tenía valor cuando llegó</text>
  <text x="490" y="326" font-family="sans-serif" font-size="14" fill="#c9d1d9">el bloque concreto. Regla:</text>
  <text x="490" y="358" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">lo concreto arriba, Host * al final</text>
  <text x="490" y="390" font-family="sans-serif" font-size="12" fill="#8b949e">Se suman: IdentityFile, SendEnv, *Forward...</text>

  <text x="450" y="448" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">ssh -G -F config lab-server   →   la configuración final, sin conectar</text>
</svg>
