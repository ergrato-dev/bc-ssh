<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0d1117"/>
  
  <!-- Título -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Estructura del Archivo ~/.ssh/config</text>
  
  <!-- Archivo completo -->
  <rect x="50" y="70" width="700" height="500" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">~/.ssh/config</text>
  
  <!-- Sección: Host específico -->
  <rect x="70" y="120" width="660" height="120" rx="6" fill="#0d1117" stroke="#238636" stroke-width="2"/>
  <text x="90" y="145" font-family="monospace" font-size="14" fill="#238636"># Servidor específico</text>
  <text x="90" y="170" font-family="monospace" font-size="14" fill="#d29922">Host</text>
  <text x="135" y="170" font-family="monospace" font-size="14" fill="#c9d1d9">produccion</text>
  <text x="110" y="195" font-family="monospace" font-size="14" fill="#8957e5">HostName</text>
  <text x="200" y="195" font-family="monospace" font-size="14" fill="#c9d1d9">192.168.1.100</text>
  <text x="110" y="220" font-family="monospace" font-size="14" fill="#8957e5">User</text>
  <text x="160" y="220" font-family="monospace" font-size="14" fill="#c9d1d9">admin</text>
  
  <!-- Badge -->
  <rect x="600" y="130" width="120" height="24" rx="4" fill="#238636"/>
  <text x="660" y="147" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Específico</text>
  
  <!-- Sección: Patrón -->
  <rect x="70" y="255" width="660" height="100" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="90" y="280" font-family="monospace" font-size="14" fill="#238636"># Patrón para grupo de servidores</text>
  <text x="90" y="305" font-family="monospace" font-size="14" fill="#d29922">Host</text>
  <text x="135" y="305" font-family="monospace" font-size="14" fill="#c9d1d9">dev-*</text>
  <text x="110" y="330" font-family="monospace" font-size="14" fill="#8957e5">User</text>
  <text x="160" y="330" font-family="monospace" font-size="14" fill="#c9d1d9">developer</text>
  
  <!-- Badge -->
  <rect x="600" y="265" width="120" height="24" rx="4" fill="#58a6ff"/>
  <text x="660" y="282" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Patrón</text>
  
  <!-- Sección: Global -->
  <rect x="70" y="370" width="660" height="120" rx="6" fill="#0d1117" stroke="#8957e5" stroke-width="2"/>
  <text x="90" y="395" font-family="monospace" font-size="14" fill="#238636"># Configuración global (todos los hosts)</text>
  <text x="90" y="420" font-family="monospace" font-size="14" fill="#d29922">Host</text>
  <text x="135" y="420" font-family="monospace" font-size="14" fill="#c9d1d9">*</text>
  <text x="110" y="445" font-family="monospace" font-size="14" fill="#8957e5">ServerAliveInterval</text>
  <text x="280" y="445" font-family="monospace" font-size="14" fill="#c9d1d9">60</text>
  <text x="110" y="470" font-family="monospace" font-size="14" fill="#8957e5">ControlMaster</text>
  <text x="240" y="470" font-family="monospace" font-size="14" fill="#c9d1d9">auto</text>
  
  <!-- Badge -->
  <rect x="600" y="380" width="120" height="24" rx="4" fill="#8957e5"/>
  <text x="660" y="397" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Global</text>
  
  <!-- Flecha de prioridad -->
  <line x1="760" y="175" x2="760" y2="440" stroke="#c9d1d9" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="760,175 755,190 765,190" fill="#c9d1d9"/>
  <text x="775" y="310" font-family="Arial, sans-serif" font-size="12" fill="#c9d1d9" transform="rotate(90 775 310)">Prioridad</text>
  
  <!-- Leyenda -->
  <text x="70" y="520" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Orden de procesamiento: Específico → Patrón → Global (primera coincidencia gana)</text>
  <text x="70" y="540" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Permisos requeridos: chmod 600 ~/.ssh/config</text>
</svg>
