<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Multiplexing: una conexión autenticada, varias sesiones</text>

  <!-- client -->
  <rect x="30" y="70" width="440" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="250" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">client</text>

  <rect x="55" y="120" width="160" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="147" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">ssh lab-server</text>
  <rect x="55" y="184" width="160" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="211" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">scp f lab-server:</text>
  <rect x="55" y="248" width="160" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="275" font-family="monospace" font-size="13" fill="#c9d1d9" text-anchor="middle">git pull</text>

  <rect x="250" y="160" width="190" height="96" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="345" y="186" font-family="sans-serif" font-size="13" fill="#d29922" text-anchor="middle">socket (srw-------)</text>
  <text x="345" y="208" font-family="monospace" font-size="12" fill="#c9d1d9" text-anchor="middle">~/.ssh/cm/%C</text>
  <text x="345" y="236" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">sin TCP, sin KEX, sin auth</text>

  <line x1="215" y1="142" x2="248" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="215" y1="206" x2="248" y2="206" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="215" y1="270" x2="248" y2="230" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="250" y="300" width="190" height="76" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="345" y="326" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">master</text>
  <text x="345" y="348" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">ssh: ~/.ssh/cm/... [mux]</text>
  <text x="345" y="366" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">sigue vivo ControlPersist</text>
  <line x1="345" y1="256" x2="345" y2="298" stroke="#8b949e" stroke-width="2" marker-end="url(#fa)"/>

  <!-- server -->
  <rect x="620" y="70" width="250" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="745" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9" text-anchor="middle">server</text>
  <rect x="660" y="300" width="170" height="76" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="745" y="330" font-family="monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">sshd</text>
  <text x="745" y="354" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">3 canales, 1 conexión</text>

  <line x1="440" y1="338" x2="658" y2="338" stroke="#3fb950" stroke-width="3" marker-end="url(#fa)"/>
  <text x="549" y="326" font-family="sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">1 TCP, 1 KEX, 1 auth</text>

  <text x="450" y="436" font-family="sans-serif" font-size="13" fill="#f85149" text-anchor="middle">Quien abre el socket entra sin autenticarse. Revocar la llave no cierra el master: ssh -O exit</text>
</svg>
